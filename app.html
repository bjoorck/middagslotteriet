<style>
  :root {
    --bg: #f8ecea;
    --card: #fffbfa;
    --card-line: #e8d3ce;
    --chalk: #3a2429;
    --chalk-dim: #8a6d6a;
    --mustard: #c6883c;
    --sage: #a15c6b;
    --rust: #a6432c;
  }
  * { box-sizing: border-box; }
  #root {
    background: var(--bg);
    background-image:
      radial-gradient(ellipse at top left, rgba(255,214,214,0.55), transparent 60%),
      radial-gradient(ellipse at bottom right, rgba(161,92,107,0.08), transparent 60%);
    color: var(--chalk);
    font-family: 'Work Sans', sans-serif;
    min-height: 100vh;
    padding: 48px 20px 64px;
    display: flex;
    justify-content: center;
  }
  .wrap { width: 100%; max-width: 600px; }
  h1 {
    font-family: 'Fraunces', serif; font-weight: 600; font-style: italic;
    font-size: 2.4rem; text-align: center; margin: 0 0 6px;
  }
  .subtitle { text-align: center; color: var(--chalk-dim); font-size: 0.95rem; margin: 0 0 40px; }
  .board {
    border: 1px solid var(--card-line); background: var(--card); border-radius: 4px;
    padding: 32px 28px; position: relative;
  }
  .board::before {
    content: ""; position: absolute; inset: 8px;
    border: 1px solid rgba(58,36,41,0.08); border-radius: 2px; pointer-events: none;
  }
  .empty-state { text-align: center; color: var(--chalk-dim); padding: 20px 0 8px; line-height: 1.6; }

  .onboarding { padding: 8px 4px 4px; }
  .onboarding-title {
    font-family: 'Fraunces', serif; font-weight: 600; font-size: 1.15rem;
    text-align: center; margin-bottom: 16px; line-height: 1.4;
  }
  .onboarding-steps { margin: 0; padding-left: 22px; color: var(--chalk); line-height: 1.7; }
  .onboarding-steps li { margin-bottom: 6px; }
  button { font-family: 'Work Sans', sans-serif; cursor: pointer; border: none; }
  .draw-btn {
    width: 100%; background: var(--mustard); color: #201505; font-weight: 600;
    font-size: 1rem; padding: 15px; border-radius: 3px;
    transition: transform 0.12s ease, background 0.12s ease;
  }
  .draw-btn:hover { background: #e5b458; }
  .draw-btn:active { transform: scale(0.98); }
  .draw-btn:disabled { opacity: 0.5; cursor: default; }

  .draw-btn-blue {
    width: 100%; background: #3f6fa8; color: #fdfbf5; font-weight: 600;
    font-size: 1rem; padding: 15px; border-radius: 3px;
    transition: transform 0.12s ease, background 0.12s ease;
  }
  .draw-btn-blue:hover { background: #4a80bd; }
  .draw-btn-blue:active { transform: scale(0.98); }

  .draw-btn-dark {
    width: 100%; background: var(--chalk); color: #fdfbf5; font-weight: 600;
    font-size: 1rem; padding: 15px; border-radius: 3px;
    transition: transform 0.12s ease, background 0.12s ease;
  }
  .draw-btn-dark:hover { background: #4d3238; }
  .draw-btn-dark:active { transform: scale(0.98); }

  .select-count { text-align: center; font-size: 0.8rem; color: var(--mustard); margin: 14px 0 4px; letter-spacing: 0.3px; }

  .filter-panel {
    border: 1px solid rgba(161,92,107,0.35); background: rgba(161,92,107,0.06);
    border-radius: 6px; padding: 14px 16px; margin-bottom: 14px;
  }
  .filter-chip-row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .filter-chip {
    background: #fffbfa; border: 1px solid rgba(198,136,60,0.4); color: var(--chalk-dim);
    font-size: 0.82rem; padding: 6px 12px; border-radius: 14px;
  }
  .filter-chip:hover { background: rgba(198,136,60,0.15); }
  .filter-chip.is-only { background: var(--mustard); border-color: var(--mustard); color: #201505; font-weight: 600; }
  .filter-chip.is-not { background: var(--rust); border-color: var(--rust); color: #fff6f2; font-weight: 600; }
  .draw-count-box {
    border: 1px solid rgba(161,92,107,0.35); background: rgba(161,92,107,0.08);
    border-radius: 6px; padding: 14px 16px; margin-bottom: 14px; text-align: center;
  }
  .draw-count-label { font-size: 0.85rem; color: var(--chalk); margin-bottom: 10px; }
  .draw-count-stepper { display: flex; align-items: center; justify-content: center; gap: 16px; }
  .draw-count-stepper button {
    background: var(--sage); color: #fdfbf5; font-size: 1.1rem; font-weight: 700;
    width: 34px; height: 34px; border-radius: 6px; display: flex; align-items: center; justify-content: center; padding: 0;
  }
  .draw-count-stepper button:hover { background: #8f4f5c; }
  .draw-count-value { font-family: 'Fraunces', serif; font-weight: 600; font-size: 1.3rem; min-width: 32px; }

  .draw-section-heading {
    font-family: 'Fraunces', serif; font-weight: 600; font-size: 1.05rem;
    color: var(--rust); text-align: center; margin: 22px 0 10px; padding-top: 14px;
    border-top: 1px solid rgba(161,92,107,0.25);
  }
  .draw-section-heading:first-of-type { border-top: none; padding-top: 0; margin-top: 4px; }
  .draw-section-sub { font-family: 'Work Sans', sans-serif; font-weight: 400; font-size: 0.82rem; color: var(--chalk-dim); display: block; margin-top: 2px; }
  .btn-plus { opacity: 0.75; }
  .btn-mobile-break { display: none; content: ''; }
  @media (max-width: 480px) {
    .btn-mobile-break { display: block; content: ''; }
  }

  .candidate-list { margin-top: 14px; display: flex; flex-direction: column; gap: 2px; }
  .candidate-row {
    position: relative; padding: 18px 10px 18px 36px;
    border-bottom: 1px solid rgba(58,36,41,0.08); border-radius: 3px;
  }
  .candidate-row:last-child { border-bottom: none; }
  .candidate-row.is-checked { background: rgba(198,136,60,0.08); }
  .fav-corner {
    position: absolute; left: 8px; top: 19px; width: 24px; height: 24px; padding: 0;
    border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: 0.85rem; line-height: 1; background: rgba(198,136,60,0.10);
    border: 1px solid rgba(198,136,60,0.4); color: var(--chalk-dim);
  }
  .fav-corner:hover { background: rgba(198,136,60,0.22); }
  .fav-corner.is-fav { background: var(--mustard); border-color: var(--mustard); color: #201505; font-weight: 600; }
  .count-btn { font-weight: 700; min-width: 42px; }
  .count-btn.c1 { background: var(--mustard); border-color: var(--mustard); color: #201505; }
  .count-btn.c2 { background: #8a5a1f; border-color: #8a5a1f; color: #fff6e6; }
  .candidate-tap { cursor: pointer; height: 70px; overflow: hidden; }
  .item-remove { background: none; color: var(--rust); font-size: 1rem; padding: 8px 10px; margin-left: auto; flex-shrink: 0; }
  .item-edit { background: none; color: var(--chalk-dim); font-size: 0.95rem; padding: 8px 6px 8px 0; flex-shrink: 0; }
  .item-edit:hover { color: var(--mustard); }
  .extra-edit-row { display: flex; gap: 8px; align-items: center; flex: 1; }
  .candidate-fav-row { margin-top: 10px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-left: -26px; width: calc(100% + 26px); }
  .portion-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
  .portion-label { font-size: 0.8rem; color: var(--chalk-dim); min-width: 46px; }

  const DEFAULT_RECIPES_TEXT = `=== Köttbullar med potatismos ===
1. Riv eller finhacka löken. Blanda ströbröd och mjölk i en skål och låt svälla 5 minuter.
2. Blanda köttfärs, ägg, den svällda ströbrödsblandningen, lök, salt och peppar. Arbeta smeten smidig med en gaffel eller händerna.
3. Forma smeten till köttbullar med våta händer, ungefär lagom stora för en tugga.
4. Hetta upp smör i en stekpanna på medelvärme. Stek köttbullarna i omgångar, rulla runt dem så de bryns jämnt, cirka 8–10 minuter tills de är genomstekta.
5. Under tiden: skala och koka potatisen mjuk i lättsaltat vatten, cirka 20 minuter. Häll av vattnet.
6. Mosa potatisen, tillsätt mjölk och smör lite i taget och rör till en jämn mos. Smaka av med salt.
7. Servera köttbullarna med potatismoset, gärna med lingonsylt och pressgurka vid sidan om.

=== Kalops ===
1. Skär eventuellt grytbitarna lite mindre om de är stora. Skala och dela löken i klyftor, skala morötterna och skär i bitar.
2. Vänd köttet i vetemjölet.
3. Bryn köttet i omgångar i smör i en gryta på hög värme tills det fått fin färg. Ta upp och lägg åt sidan.
4. Bryn löken i samma gryta ett par minuter.
5. Lägg tillbaka köttet, tillsätt morötter, kryddpepparkorn, lagerblad, buljong, salt och vatten. Vattnet ska nästan täcka innehållet.
6. Låt sjuda under lock på svag värme i 2–2,5 timmar, tills köttet är mört. Rör om då och då och fyll på lite vatten om det kokar in för mycket.
7. Smaka av med mer salt om det behövs. Ta bort lagerbladen före servering.
8. Koka potatisen mjuk i lättsaltat vatten under tiden. Servera kalopsen med kokt potatis och gärna lingonsylt.

=== Pannbiff med lök ===
1. Blanda ströbröd och mjölk, låt svälla 5 minuter.
2. Blanda nötfärs, ägg, den svällda smeten, salt och peppar. Arbeta ihop till en jämn smet.
3. Skala löken och skär i tunna ringar eller halvmånar.
4. Fräs löken i en msk smör på medelvärme tills den är mjuk och gyllene, cirka 8 minuter. Ta upp och ställ åt sidan.
5. Forma färsen till fyra platta biffar.
6. Stek biffarna i resten av smöret, 3–4 minuter per sida, tills de är genomstekta.
7. Koka potatisen mjuk i lättsaltat vatten under tiden, häll av vattnet och tillsätt mjölk, mosa lätt eller servera hela.
8. Lägg löken ovanpå biffarna och servera med potatisen.

=== Kåldolmar ===
1. Ta bort de yttre grova bladen på vitkålen. Koka upp lättsaltat vatten i en stor gryta och lägg i kålhuvudet, koka 5–8 minuter tills bladen mjuknar och går lätt att lossa. Lossa bladen försiktigt allt eftersom, ett i taget, och låt dem svalna. Skär bort den grova mittnerven på varje blad.
2. Koka riset enligt paketets anvisningar och låt svalna något.
3. Blanda köttfärs, kokt ris, ägg, mjölk, salt och peppar till en jämn smet.
4. Lägg en klick färs på varje kålblad, vik in kanterna och rulla ihop till ett paket.
5. Bryn kåldolmarna runt om i smör i en stekpanna, lägg dem sedan i en ugnsform.
6. Ringla över lönnsirap och häll på lite vatten i botten av formen.
7. Grädda i ugn, 175 grader, cirka 30–40 minuter tills de är genomstekta.
8. Koka potatisen under tiden. Servera kåldolmarna med kokt potatis, sky och gärna lingonsylt.

=== Lasagne ===
1. Skala och finhacka löken och vitlöken.
2. Fräs löken och vitlöken i en gryta med lite olja tills löken blir mjuk.
3. Lägg i nötfärsen och stek den gyllenbrun, bryt sönder klumpar med en slev.
4. Tillsätt krossade tomater och salt. Låt såsen sjuda på svag värme i minst 20 minuter, gärna längre, rör om ibland.
5. Sätt ugnen på 200 grader.
6. Varva köttfärssås, lasagneplattor och bechamelsås i en ugnsform, börja och sluta med sås. Avsluta med ett lager bechamelsås och strö över den rivna osten.
7. Grädda i mitten av ugnen i 35–40 minuter, tills plattorna är mjuka och ytan gyllenbrun.
8. Låt lasagnen vila 5–10 minuter innan du skär upp den, då håller bitarna bättre ihop.

=== Tacos ===
1. Fräs nötfärsen i olja i en stekpanna på hög värme tills den är genomstekt och fått fin färg.
2. Rör ner tacokryddan och salt, tillsätt lite vatten enligt anvisningen på kryddpåsen och låt puttra ihop några minuter.
3. Skär tomaterna i tärningar och strimla isbergssalladen under tiden.
4. Värm tortillabröden hastigt i en torr stekpanna eller i ugnen, några sekunder per sida.
5. Riv osten.
6. Duka fram färsen, tortillabröden, osten, tomat och sallad så alla kan bygga sina egna tacos.

=== Kycklingtikka masala ===
1. Skär kycklingfiléerna i bitar.
2. Bryn kycklingbitarna i olja i en stekpanna eller gryta på hög värme tills de fått lite färg.
3. Rör i garam masala och salt, låt kryddorna fräsa med en minut så aromerna vaknar.
4. Häll i de krossade tomaterna, låt sjuda på svag värme i 10 minuter under lock.
5. Rör ner grädden och låt såsen sjuda ytterligare 10 minuter, tills kycklingen är helt genomstekt och såsen tjocknat något.
6. Koka riset enligt paketets anvisningar under tiden.
7. Smaka av såsen med mer salt om det behövs. Servera med riset.

=== Pad thai ===
1. Blötlägg rispastan i kallt eller ljummet vatten enligt paketets anvisningar, tills den är mjuk men fortfarande lite tuggmotstånd (al dente). Häll av.
2. Vispa ihop äggen i en skål.
3. Hetta upp en wok eller stor stekpanna på hög värme. Stek räkorna hastigt tills de precis blivit rosa, ta upp och ställ åt sidan.
4. Häll äggen i samma panna och rör om snabbt tills de stelnat till små bitar, för dem åt sidan i pannan.
5. Lägg i den avrunna rispastan, tamarindpasta och salt. Vänd runt så pastan blandas jämnt med äggen.
6. Lägg tillbaka räkorna och tillsätt böngroddarna, vänd runt ytterligare någon minut tills allt är varmt.
7. Smaka av med mer tamarindpasta eller salt om det behövs. Servera direkt.

=== Fisksoppa ===
1. Skölj fisken och skär i bitar. Skölj räkorna om de är råa.
2. Skiva fänkålen tunt.
3. Fräs fänkålen i smör i en gryta på medelvärme tills den mjuknat, 5 minuter.
4. Häll i de krossade tomaterna och låt puttra 10 minuter.
5. Tillsätt grädde, salt och peppar, låt sjuda upp.
6. Lägg i fiskbitarna och låt sjuda försiktigt på svag värme i 5–6 minuter, tills fisken precis är genomstekt (rör inte om för hårt, då faller den sönder).
7. Lägg i räkorna sista minuten, bara tills de blir varma.
8. Smaka av och servera direkt, gärna med bröd vid sidan om.

=== Vegetarisk chili sin carne ===
1. Skölj och häll av de röda och svarta bönorna.
2. Skär paprikan i mindre bitar.
3. Häll de krossade tomaterna i en gryta, tillsätt bönorna, paprikan, salt och peppar.
4. Låt allt sjuda på svag till medelvärme i 20–25 minuter under lock, rör om då och då, tills paprikan är mjuk och smakerna gått ihop.
5. Smaka av, tillsätt eventuellt mer salt eller lite chilipulver om du vill ha den starkare.
6. Servera med ris, gräddfil eller majsbröd, precis som du föredrar.

=== Ärtsoppa med fläsk ===
1. Skölj de gula ärtorna i en sil.
2. Lägg ärtor, fläsklägg, hel lök och timjan i en stor gryta. Häll på vattnet.
3. Koka upp och skumma bort det skum som bildas på ytan.
4. Sänk värmen och låt sjuda under lock i cirka 1,5 timme, tills ärtorna fallit sönder och köttet är mört. Rör om ibland så det inte bränner fast i botten.
5. Lyft ur löken, lyft ur fläskläggen och skär köttet i bitar. Lägg tillbaka köttet i soppan.
6. Smaka av med salt. Servera med senap vid sidan om.

=== Biff Rydberg ===
1. Skala potatisen och skär i små tärningar, cirka 1 cm.
2. Stek potatistärningarna i hälften av smöret i en stekpanna på medelvärme tills de är gyllenbruna och mjuka, cirka 10–12 minuter. Krydda med salt och peppar, lägg åt sidan.
3. Skala och finhacka löken. Stek löken i lite smör tills den är mjuk och gyllene, cirka 5 minuter. Lägg åt sidan.
4. Skär oxfilén i tärningar. Stek köttet hastigt i resten av smöret på hög värme, bara ett par minuter så det får fin stekyta men förblir rosa inuti.
5. Blanda potatis, lök och kött i pannan, värm ihop snabbt.
6. Servera med en rå äggula i en halv äggskal eller skål ovanpå varje portion och kapris vid sidan om.

=== Wallenbergare ===
1. Blanda kalvfärsen med äggulorna, hälften av grädden, ströbröd och salt. Arbeta smeten smidig.
2. Tillsätt resten av grädden lite i taget och fortsätt arbeta smeten till den är jämn och lite lös.
3. Forma smeten till fyra runda biffar med våta händer.
4. Stek biffarna i smör på medelvärme, cirka 5–6 minuter per sida, tills de är genomstekta och fått fin färg.
5. Koka potatisen mjuk i lättsaltat vatten under tiden. Koka även ärtorna ett par minuter.
6. Servera biffarna med potatisen och ärtorna, och gärna lite extra smör smält över.

=== Lax med potatismos och dillsås ===
1. Skala potatisen, koka den mjuk i lättsaltat vatten, cirka 20 minuter.
2. Salta laxfiléerna och lägg dem i en ugnsform eller stek dem i smör i en stekpanna på medelvärme, cirka 4 minuter per sida tills de är genomstekta.
3. Häll av potatisvattnet, mosa potatisen med mjölk och smör till ett jämnt mos.
4. Till såsen: värm grädden i en kastrull. Red av med vetemjölet utrört i lite kallt vatten, låt sås sjuda en minut.
5. Tillsätt hackad dill och citron i såsen, smaka av med salt.
6. Servera laxen med potatismoset och dillsåsen.

=== Kokt torsk med äggsås ===
1. Koka upp lättsaltat vatten i en vid panna. Lägg i torskfiléerna och låt dem sjuda försiktigt, cirka 8–10 minuter tills fisken är genomstekt och lossar lätt i flagor.
2. Koka samtidigt äggen hårda, cirka 8 minuter, skölj kalla, skala och hacka dem.
3. Koka potatisen mjuk i lättsaltat vatten.
4. Till äggsåsen: smält smöret i en kastrull, vispa in vetemjölet och löp upp med mjölk under vispning till en jämn sås. Låt sjuda några minuter.
5. Rör ner de hackade äggen och persiljan i såsen, smaka av med salt.
6. Lyft upp torsken försiktigt med en hålslev och servera med potatisen och äggsåsen.

=== Fiskgratäng ===
1. Sätt ugnen på 200°C.
2. Skala potatisen och skiva den tunt. Förkoka skivorna några minuter i lättsaltat vatten, häll av.
3. Skär fisken i bitar. Varva potatisskivor och fiskbitar i en smord ugnsform, salta mellan lagren.
4. Fördela räkorna ovanpå.
5. Häll grädden över och strö över den rivna osten.
6. Grädda i ugnen cirka 30–35 minuter tills gratängen är gyllenbrun och fisken genomstekt.
7. Strö över hackad dill innan servering.

=== Plättar med lingon ===
1. Vispa ihop ägg och hälften av mjölken i en bunke.
2. Vispa ner mjölet och resten av mjölken växelvis till en jämn, lagom tjock smet. Tillsätt salt.
3. Låt smeten svälla i kylen minst 20 minuter om det finns tid.
4. Smält lite smör i en plättlagg eller stekpanna. Häll i smet för varje plätt och stek på medelvärme tills undersidan är gyllenbrun, vänd och stek klart.
5. Servera plättarna varma med lingonsylt.

=== Kycklinggryta med curry ===
1. Skär kycklingfiléerna i bitar. Skala och finhacka löken, skär paprikan i strimlor.
2. Hetta upp oljan i en gryta, bryn kycklingbitarna på medelhög värme tills de fått färg.
3. Tillsätt löken och fräs med ett par minuter.
4. Rör i currypulvret och låt det fräsa med en minut så aromerna vaknar.
5. Häll i kokosmjölken och paprikan, låt sjuda under lock i cirka 15 minuter tills kycklingen är genomstekt och såsen tjocknat något.
6. Smaka av med salt. Koka riset under tiden enligt paketets anvisningar och servera tillsammans.

=== Kycklingfilé med citron och timjan ===
1. Blanda olja, pressad citron, timjan, salt och peppar i en skål. Lägg kycklingfiléerna i marinaden och låt stå minst 15 minuter.
2. Hetta upp en stekpanna och stek kycklingfiléerna på medelvärme, cirka 5–6 minuter per sida, tills de är genomstekta.
3. Koka potatisen mjuk i lättsaltat vatten under tiden.
4. Ånga eller koka broccolin några minuter tills den är lagom mjuk.
5. Servera kycklingen med potatisen och broccolin, ringla eventuellt över lite av stekskyn.

=== Sjömansbiff ===
1. Skär biffen i tunna skivor. Skala potatisen och skär i tjocka skivor. Skala och skiva löken.
2. Bryn köttskivorna hastigt i smör i en gryta, ta upp och lägg åt sidan.
3. Fräs löken i samma gryta ett par minuter.
4. Varva kött, lök och potatisskivor i grytan.
5. Vänd ihop vetemjöl med lite av ölet till en jämn röra, häll därefter i resten av ölet över.
6. Låt sjuda under lock på svag värme cirka 45 minuter tills potatisen är mjuk. Smaka av med salt och peppar.

=== Fläskfilé med senapssås ===
1. Salta fläskfilén och bryn den i smör i en stekpanna på medelhög värme runt om, cirka 3–4 minuter.
2. Sänk värmen, lägg på lock och låt steka klart cirka 8–10 minuter tills köttet är genomstekt. Ta upp och låt vila under folie.
3. Häll grädden i samma panna, låt sjuda upp och red av lätt om så önskas.
4. Rör ner dijonsenapen i såsen, smaka av.
5. Koka potatisen mjuk i lättsaltat vatten och ånga haricots verts några minuter.
6. Skär fläskfilén i skivor och servera med såsen, potatisen och haricots verts.

=== Kalvfrikassé ===
1. Skär kalvbogen i bitar. Skala morötterna och skär i bitar, skiva purjolöken.
2. Bryn köttbitarna lätt i smör i en gryta, utan att de tar färg.
3. Tillsätt morot och purjolök, fräs med ett par minuter.
4. Pudra över vetemjölet och rör om, häll därefter på vattnet under omröring.
5. Låt sjuda under lock på svag värme cirka 1 timme tills köttet är mört.
6. Rör ner grädden och låt sjuda ytterligare 5 minuter. Smaka av med salt.
7. Koka riset enligt paketets anvisningar och servera tillsammans med frikassén.

=== Grönkålssoppa med korv ===
1. Skala och tärna potatisen och löken. Skiva korven.
2. Fräs löken i lite olja eller smör i en gryta ett par minuter.
3. Häll på buljongen, lägg i potatisen och koka cirka 15 minuter tills potatisen är mjuk.
4. Tillsätt grönkål och korv, låt sjuda ytterligare 5–10 minuter.
5. Smaka av med salt och peppar.

=== Spaghetti bolognese ===
1. Skala och finhacka löken och vitlöken.
2. Bryn nötfärsen i olivolja i en gryta på hög värme tills den fått fin färg, dela sönder eventuella klumpar.
3. Tillsätt löken och vitlöken, fräs med ett par minuter.
4. Rör i tomatpurén och de krossade tomaterna, krydda med salt och peppar.
5. Låt såsen sjuda på svag värme under lock i minst 20–30 minuter, rör om ibland.
6. Koka spaghettin enligt paketets anvisningar under tiden.
7. Servera pastan med såsen och riven parmesan ovanpå.

=== Carbonara ===
1. Koka spaghettin enligt paketets anvisningar i rikligt saltat vatten.
2. Skär baconet i små bitar och stek knaprigt i en stekpanna, utan extra fett.
3. Vispa ihop äggulorna med riven parmesan och svartpeppar i en skål.
4. Pressa i vitlöken i pannan med baconet de sista minuterna.
5. Häll av pastan men spara lite kokvatten. Blanda snabbt ner den varma pastan i äggblandningen tillsammans med baconet, rör om intensivt så äggen tjocknar utan att stelna till klumpar — häll i lite kokvatten om såsen blir för tjock.
6. Servera genast med extra parmesan.

=== Pasta pesto med kyckling ===
1. Skär kycklingfiléerna i bitar, krydda med salt och peppar.
2. Stek kycklingbitarna i olivolja på medelhög värme tills de är genomstekta och fått fin färg, cirka 8–10 minuter.
3. Koka pastan enligt paketets anvisningar under tiden, spara lite kokvatten.
4. Blanda den avrunna pastan med pesto, tillsätt lite kokvatten om såsen behöver bli lösare.
5. Vänd ner kycklingen i pastan och servera med riven parmesan ovanpå.

=== Pasta arrabbiata ===
1. Koka pennen enligt paketets anvisningar i saltat vatten.
2. Finhacka vitlöken och chilin.
3. Fräs vitlök och chili i olivolja i en kastrull på låg värme en minut, utan att det bränns.
4. Häll i de krossade tomaterna, smaka av med salt, och låt såsen sjuda 10–15 minuter.
5. Blanda den avrunna pastan med såsen och servera.

=== Risotto med svamp ===
1. Skala och finhacka löken. Skiva champinjonerna.
2. Fräs löken i olivolja i en gryta tills den är mjuk, tillsätt champinjonerna och stek tills de släppt sin vätska och fått färg.
3. Rör i risottoriset och låt det fräsa med en minut.
4. Häll på buljongen en skopa i taget under konstant omröring, låt varje skopa koka in innan nästa tillsätts.
5. Fortsätt i cirka 18–20 minuter tills riset är krämigt och al dente.
6. Rör ner riven parmesan, smaka av med salt och peppar.

=== Pizza margherita ===
1. Sätt ugnen på högsta temperatur (minst 250°C) med en plåt eller pizzasten i.
2. Kavla ut pizzadegen tunt på ett mjölat underlag.
3. Bred ut de krossade tomaterna över degen, krydda med salt och peppar.
4. Riv eller skiva mozzarellan och fördela över pizzan.
5. Grädda direkt på den heta plåten i cirka 8–12 minuter tills kanterna är gyllenbruna och osten bubblar.
6. Strö över färsk basilika innan servering.

=== Pizza med skinka och champinjon ===
1. Sätt ugnen på högsta temperatur (minst 250°C).
2. Kavla ut pizzadegen tunt.
3. Bred ut de krossade tomaterna, krydda med salt och peppar.
4. Fördela skinka, skivade champinjoner och mozzarella över degen, ringla över lite olivolja.
5. Grädda i cirka 10–12 minuter tills osten bubblar och kanterna fått färg.

=== Kycklingschnitzel milanese ===
1. Platta ut kycklingfiléerna lätt med en köttklubba mellan plastfolie, krydda med salt och peppar.
2. Vispa upp äggen i en skål. Blanda ströbröd med riven parmesan på en tallrik.
3. Doppa kycklingfiléerna först i ägget, sedan i ströbrödsblandningen så de blir jämnt panerade.
4. Stek i olivolja på medelhög värme, cirka 4–5 minuter per sida, tills de är genomstekta och gyllenbruna.
5. Servera med pressad citron över.

=== Saltimbocca ===
1. Platta ut kalvfiléerna lätt. Lägg ett blad salvia på varje skiva och vira runt en skiva parmaskinka, fäst med en tandpetare om det behövs.
2. Stek rullarna i smör på medelhög värme, cirka 2–3 minuter per sida, tills köttet är genomstekt.
3. Ta upp köttet, häll i vinet i pannan och låt det koka ihop till en skysås, skrapa loss stekytorna.
4. Smaka av såsen med salt och peppar, häll över köttet vid servering.

=== Osso buco ===
1. Krydda kalvskankarna med salt och peppar. Bryn dem i smör i en gryta på hög värme tills de fått fin färg, ta upp.
2. Skala och tärna lök och morot, fräs dem i samma gryta ett par minuter.
3. Lägg tillbaka köttet, häll i vinet och låt det koka in något.
4. Tillsätt de krossade tomaterna, lägg på lock och låt sjuda på svag värme i cirka 1,5–2 timmar tills köttet är mört och lossar från benet.
5. Smaka av med salt och peppar innan servering.

=== Minestrone ===
1. Skär grönsakerna i bitar.
2. Fräs grönsakerna i lite olja i en gryta ett par minuter.
3. Häll på buljongen och de krossade tomaterna, koka upp.
4. Tillsätt pastan och de vita bönorna, låt sjuda cirka 10–12 minuter tills pastan är klar.
5. Smaka av med salt och peppar.

=== Caprese-sallad med grillad kyckling ===
1. Krydda kycklingfiléerna med salt och peppar, stek eller grilla dem i olivolja cirka 5–6 minuter per sida tills genomstekta.
2. Skiva tomaterna och mozzarellan.
3. Varva tomat och mozzarella på en tallrik, strö över färsk basilika.
4. Skär den stekta kycklingen i skivor och lägg ovanpå.
5. Ringla över olivolja och smaka av med salt och peppar.

=== Tacogryta ===
1. Bryn nötfärsen i olja i en gryta.
2. Rör i tacokryddan, häll därefter i de krossade tomaterna, majsen och de svarta bönorna.
3. Låt sjuda på svag värme i cirka 15 minuter, smaka av med salt.
4. Servera som den är eller med tortillabröd, riven ost och gräddfil vid sidan om.

=== Fajitas med kyckling ===
1. Skär kycklingfiléerna och paprikan i strimlor, skiva löken.
2. Stek kycklingen i olja på hög värme tills den nästan är genomstekt.
3. Tillsätt paprika och lök, fortsätt steka ett par minuter.
4. Rör i fajitakryddan tillsammans med lite vatten, låt sjuda ihop en minut.
5. Värm tortillabröden och servera fyllningen tillsammans med dem så alla kan rulla sina egna fajitas.

=== Enchiladas ===
1. Sätt ugnen på 200°C.
2. Riv eller strimla kycklingfiléerna (använd tillagad kyckling, eller stek den först i en panna tills genomstekt och strimla).
3. Blanda kycklingen med lite av salsan.
4. Fördela fyllningen i tortillabröden, rulla ihop dem och lägg i en ugnsform.
5. Häll resten av salsan över, strö över riven ost.
6. Grädda cirka 15–20 minuter tills osten smält och fått färg.
7. Toppa med gräddfil innan servering.

=== Chili con carne ===
1. Bryn nötfärsen i olja i en gryta på hög värme.
2. Tillsätt den skurna paprikan och chilipulvret, fräs med en minut.
3. Häll i de krossade tomaterna och de röda bönorna.
4. Låt sjuda på svag värme under lock i minst 20–30 minuter, rör om ibland.
5. Smaka av med salt.

=== Quesadillas ===
1. Skär kycklingfiléerna och paprikan i mindre bitar, stek i olja tills kycklingen är genomstekt.
2. Krydda med salt och peppar.
3. Lägg riven ost och kycklingblandningen på halva varje tortillabröd, vik ihop till en halvmåne.
4. Stek quesadillorna i en torr stekpanna på medelvärme, cirka 2–3 minuter per sida, tills osten smält och brödet fått fin färg.
5. Skär i bitar och servera varma.

=== Burritos ===
1. Bryn nötfärsen i olja i en stekpanna, krydda med salt och peppar.
2. Koka riset enligt paketets anvisningar.
3. Värm de svarta bönorna.
4. Lägg ris, färs, bönor och riven ost på varje tortillabröd.
5. Vik in sidorna och rulla ihop till en tät rulle.

=== Guacamole-tacos med räkor ===
1. Mosa avokadon med pressad lime, finhackad rödlök och salt till en guacamole.
2. Blanda räkorna med lite av guacamolen eller lägg dem ovanpå.
3. Värm tortillabröden enligt förpackningens anvisning.
4. Fyll tortillabröden med guacamole och räkor, krydda med svartpeppar.

=== Ceviche ===
1. Skär den vita fisken i små tärningar.
2. Lägg fisken i en skål och häll pressad lime över, se till att allt täcks.
3. Tillsätt finhackad rödlök och chili.
4. Låt stå i kylen cirka 15–20 minuter tills fisken "kokat" i limesaften och blivit genomskinligt vit.
5. Strö över hackad koriander innan servering.

=== Butter chicken ===
1. Skär kycklingfiléerna i bitar.
2. Bryn kycklingen i smöret i en gryta på medelhög värme.
3. Rör i currypastan och låt den fräsa med en minut.
4. Häll i de krossade tomaterna, låt sjuda under lock cirka 10 minuter.
5. Rör ner grädden och låt sjuda ytterligare 10 minuter tills kycklingen är genomstekt och såsen krämig.
6. Smaka av med salt.

=== Dahl med linser ===
1. Skölj linserna i en sil.
2. Lägg linser och krossade tomater i en kastrull.
3. Rör i currypulvret, häll på kokosmjölken.
4. Låt sjuda på svag värme cirka 20–25 minuter, rör om ibland, tills linserna är mjuka och dahlen tjocknat.
5. Smaka av med salt. Koka riset enligt paketets anvisningar och servera tillsammans.

=== Grönsakscurry ===
1. Skär grönsakerna i bitar.
2. Fräs currypastan hastigt i en kastrull eller wokpanna en minut.
3. Tillsätt grönsakerna och häll på kokosmjölken.
4. Låt sjuda på medelvärme cirka 10–15 minuter tills grönsakerna är mjuka.
5. Smaka av med salt. Koka riset enligt paketets anvisningar och servera tillsammans.

=== Kycklingbiryani ===
1. Skär kycklingfiléerna i bitar, skala och finhacka löken.
2. Bryn kycklingen och löken i olja i en gryta på medelhög värme.
3. Rör i garam masala och yoghurten, låt det fräsa ihop en minut.
4. Tillsätt riset och häll på vatten enligt rissortens anvisning (ungefär dubbelt så mycket vatten som ris).
5. Koka upp, sänk därefter till svag värme, lägg på lock och låt sjuda cirka 15–20 minuter tills riset är klart och vattnet sugits upp.
6. Smaka av med salt och rör om lätt innan servering.

=== Naanbröd med linsgryta ===
1. Skölj linserna i en sil.
2. Lägg linser och krossade tomater i en kastrull, rör i currypulvret.
3. Låt sjuda på svag värme cirka 20 minuter tills linserna är mjuka.
4. Smaka av med salt.
5. Värm naanbröden enligt förpackningens anvisning och servera tillsammans med grytan.

=== Kycklingwok med grönsaker ===
1. Skär kycklingfiléerna i tunna strimlor.
2. Hetta upp sesamoljan i en wokpanna eller stor stekpanna på hög värme, stek kycklingen tills den nästan är genomstekt.
3. Tillsätt wokgrönsakerna och fortsätt steka ett par minuter tills de är lagom knapriga.
4. Häll i sojan, rör om och låt steka ihop en minut till.
5. Koka nudlarna enligt paketets anvisningar under tiden och servera tillsammans.

=== Nötkött i oystersås ===
1. Skär köttet i tunna strimlor.
2. Hetta upp oljan i en wokpanna på hög värme, stek köttet snabbt tills det fått färg, ta upp.
3. Stek broccolin i samma panna ett par minuter.
4. Lägg tillbaka köttet, häll i ostronsåsen och sojan, rör om och låt steka ihop en minut.
5. Koka riset enligt paketets anvisningar och servera tillsammans.

=== Kung pao chicken ===
1. Skär kycklingfiléerna i bitar, skär paprikan i bitar.
2. Hetta upp oljan i en wokpanna på hög värme, stek kycklingen tills den är genomstekt.
3. Tillsätt paprikan och fortsätt steka ett par minuter.
4. Rör i sojan och chiliflakes, låt steka ihop en kort stund.
5. Strö över jordnötterna precis innan servering.

=== Sötsur fläsk ===
1. Skär fläskytterfilén i bitar.
2. Stek köttbitarna i smöret i en stekpanna på medelhög värme tills de är genomstekta och fått fin färg.
3. Tillsätt skuren paprika och ananasbitar, fortsätt steka ett par minuter.
4. Rör ihop ketchup och vinäger, häll över i pannan och låt sjuda ihop en minut till en sötsur sås.
5. Smaka av med salt och peppar.

=== Yakisoba ===
1. Skär kycklingfiléerna i bitar.
2. Hetta upp oljan i en wokpanna, stek kycklingen tills den nästan är genomstekt.
3. Tillsätt de blandade grönsakerna och fortsätt steka ett par minuter.
4. Koka nudlarna enligt paketets anvisningar, häll av och blanda ner i pannan.
5. Rör i sojan, smaka av med salt och peppar, stek ihop allt ett par minuter.

=== Teriyakilax ===
1. Blanda soja, honung och riven ingefära till en marinad.
2. Lägg laxfiléerna i marinaden och låt stå minst 10 minuter.
3. Stek laxen i olja i en stekpanna på medelvärme, cirka 4 minuter per sida, pensla med extra marinad under stekningen.
4. Koka riset enligt paketets anvisningar under tiden.
5. Servera laxen med riset, och häll eventuell kvarvarande sås över.

=== Miso soppa med tofu ===
1. Skär tofun i små tärningar, skiva vårlöken.
2. Koka upp dashin i en kastrull.
3. Ta av från värmen och rör ut misopastan i buljongen (koka inte upp misopastan, det förstör smaken).
4. Lägg i tofun och vårlöken, låt värmas igenom ett par minuter.

=== Bibimbap ===
1. Koka riset enligt paketets anvisningar.
2. Strimla spenat och morot var för sig, stek var sort kort i smör på medelvärme, krydda lätt med salt.
3. Stek nötköttet i smör på hög värme tills genomstekt, krydda med salt och peppar.
4. Stek äggen som solöga i en separat panna.
5. Lägg upp ris i skålar, toppa med nötkött, spenat, morot och ett stekt ägg i varje skål.

=== Koreansk kycklinggryta ===
1. Skär kycklingfiléerna i bitar.
2. Bryn kycklingen i olja i en gryta på medelhög värme.
3. Rör i gochujang, soja och honung, låt det fräsa ihop en minut.
4. Häll på lite vatten, låt sjuda under lock cirka 15 minuter tills kycklingen är genomstekt och såsen tjocknat.
5. Smaka av med salt. Koka riset enligt paketets anvisningar och servera tillsammans.

=== Falafel med hummus ===
1. Låt kikärtorna rinna av ordentligt. Mixa dem med finhackad lök och spiskummin till en grov smet (eller kör i matberedare).
2. Forma smeten till små bollar, krydda med salt och peppar.
3. Stek falafelbollarna i olivolja på medelvärme, cirka 3–4 minuter per sida, tills de är genomstekta och gyllenbruna.
4. Värm pitabröden enligt förpackningens anvisning.
5. Fyll pitabröden med falafel och hummus.
=== Caesarsallad med kyckling ===
1. Stek kycklingfiléerna i olja, krydda med salt, tills genomstekta. Låt svalna något och skiva.
2. Riv romansalladen grovt och lägg i en stor skål.
3. Blanda i kyckling, krutonger och dressing, toppa med rivet eller hyvlat parmesan.

=== Grekisk sallad ===
1. Skär tomat och gurka i bitar, skiva rödlöken tunt.
2. Blanda grönsakerna i en skål med oliver.
3. Bryt fetaosten i bitar över salladen, ringla över olivolja och strö på oregano och salt.

=== Kycklingsallad med mango ===
1. Stek kycklingfiléerna i olja tills genomstekta, krydda med salt. Låt svalna och skiva.
2. Skala och skär mangon i tärningar.
3. Blanda sallad, kyckling och mango i en skål, toppa med rostade cashewnötter.

=== Räksallad med dill ===
1. Skär avokadon i skivor och pressa över lite citron för att hindra missfärgning.
2. Blanda majonnäs med dill och en skvätt citronsaft till en dressing.
3. Varva sallad, räkor och avokado på tallrikar, ringla över dressingen.

=== Quinoasallad med halloumi ===
1. Koka quinoan enligt paketets anvisningar, låt svalna.
2. Skiva halloumin och stek gyllenbrun i olivolja.
3. Blanda quinoa med halvera körsbärstomater och olivolja, krydda med salt. Toppa med stekt halloumi.

=== Pastasallad med skinka ===
1. Koka pastan enligt anvisningen, skölj kallt och låt rinna av.
2. Tärna skinka och paprika.
3. Blanda pasta, skinka, paprika och majs med majonnäs, smaka av med salt.

=== Couscoussallad med granatäpple ===
1. Häll kokande vatten över couscousen enligt paketets anvisning, låt svälla under lock och lufta sedan med en gaffel.
2. Kärna ur granatäpplet.
3. Blanda couscous med granatäpplekärnor och rostad mandel, ringla över olivolja och salta.

=== Tonfisksallad med vita bönor ===
1. Låt de vita bönorna rinna av och skölj dem.
2. Finhacka rödlöken.
3. Blanda bönor, tonfisk och rödlök i en skål, ringla över olivolja och smaka av med salt.

=== Skagenmacka ===
1. Blanda räkor med crème fraiche och majonnäs.
2. Pressa i lite citronsaft, smaka av.
3. Rosta rågbrödet lätt, toppa med räkröran och avsluta med en klick löjrom.

=== Caprese-macka ===
1. Rosta brödskivorna lätt.
2. Skiva tomat och mozzarella.
3. Varva tomat och mozzarella på brödet, toppa med basilikablad och ringla över olivolja.

=== Skinkmacka med brie ===
1. Skiva baguetten och bredda den.
2. Lägg på skinka och skivad brieost.
3. Toppa med en klick fikonmarmelad.

=== Avokadomacka med ägg ===
1. Koka äggen i cirka 6–7 minuter för löskokt konsistens, skala och halvera.
2. Mosa avokadon lätt med en gaffel, krydda med salt och chiliflakes.
3. Bred avokadon på rostat bröd och toppa med äggen.

=== Kycklingwrap ===
1. Stek kycklingfiléerna i olja tills genomstekta, krydda med salt, och skiva.
2. Värm tortillabröden lätt i en torr stekpanna.
3. Fyll med sallad, tomat, kyckling och dressing, rulla ihop.

=== Hummusmacka med grönsaker ===
1. Strimla gurka och morot tunt.
2. Bred ett tjockt lager hummus på brödet.
3. Toppa med grönsaksstrimlorna och groddar.

=== BLT-macka ===
1. Stek baconet knaprigt i en stekpanna.
2. Rosta brödet.
3. Bred på majonnäs och varva med sallad, tomatskivor och bacon.

=== Rostbiffmacka ===
1. Bred rågbrödet med remouladsås.
2. Lägg på tunna skivor rostbiff.
3. Toppa med tunt skivad rödlök och senapskrasse.

=== Potatisgratäng ===
1. Sätt ugnen på 200°C. Skala och skiva potatisen tunt.
2. Varva potatisskivorna i en smord form, salta mellan lagren och pressa i vitlöken i grädden.
3. Häll grädden över potatisen, toppa med riven ost och grädda cirka 45 minuter tills potatisen är mjuk och ytan gyllenbrun.

=== Klyftpotatis i ugn ===
1. Sätt ugnen på 225°C. Skär potatisen i klyftor med skalet kvar.
2. Vänd klyftorna i olivolja, paprikapulver och salt på en plåt med bakplåtspapper.
3. Grädda cirka 25–30 minuter tills klyftorna är mjuka och lätt gyllenbruna, vänd dem halvvägs.

=== Coleslaw ===
1. Strimla vitkålen fint och riv morötterna grovt.
2. Blanda majonnäs och vinäger till en dressing, smaka av med salt.
3. Vänd ihop kål och morot med dressingen, låt stå kallt en stund innan servering.

=== Rostade rotfrukter ===
1. Sätt ugnen på 200°C. Skala och dela morot, palsternacka och rödbeta i jämnstora bitar.
2. Vänd rotfrukterna i olivolja och salt på en plåt.
3. Rosta cirka 30–35 minuter tills rotfrukterna är mjuka och fått fin färg.

=== Bakad potatis med topping ===
1. Sätt ugnen på 200°C. Skrubba potatisarna och stick några hål med en gaffel.
2. Grädda potatisarna cirka 50–60 minuter tills de är mjuka rakt igenom.
3. Stek baconet knaprigt. Snitta upp potatisarna och toppa med gräddfil, riven ost, bacon och gräslök.

=== Rostade grönsaker med fetaost ===
1. Sätt ugnen på 200°C. Skär zucchini, paprika och rödlök i bitar.
2. Vänd grönsakerna i olivolja på en plåt.
3. Rosta cirka 20–25 minuter, smula fetaost över de varma grönsakerna innan servering.

=== Ugnsbakad sötpotatis ===
1. Sätt ugnen på 200°C. Skala sötpotatisen och skär i klyftor.
2. Vänd klyftorna i olivolja, spiskummin och salt.
3. Grädda cirka 25–30 minuter tills klyftorna är mjuka.

=== Ris pilaff ===
1. Fräs finhackad lök i smör tills den mjuknat.
2. Rör i riset och gurkmejan, låt riset bli blankt.
3. Häll på buljongen, låt sjuda under lock enligt riskornets koktid tills vätskan sugits upp.

=== Purjolökspaj ===
1. Sätt ugnen på 200°C. Nagga pajdegen och förgrädda den i formen cirka 10 minuter.
2. Strimla purjolöken och fräs mjuk i smör.
3. Vispa ihop ägg och grädde, rör i purjolök och ost, häll i pajskalet och grädda cirka 30 minuter tills smeten stelnat.

=== Laxpaj ===
1. Sätt ugnen på 200°C. Nagga pajdegen och förgrädda den i formen cirka 10 minuter.
2. Skär laxen i bitar och fördela i pajskalet tillsammans med hackad dill.
3. Vispa ihop ägg och crème fraiche, krydda med salt, häll över laxen och grädda cirka 30 minuter tills smeten stelnat.

=== Spenatpaj med fetaost ===
1. Sätt ugnen på 200°C. Nagga pajdegen och förgrädda den i formen cirka 10 minuter.
2. Fräs spenaten hastigt tills den sjunker ihop, låt rinna av.
3. Vispa ihop ägg och grädde, rör i spenat och smulad fetaost, häll i pajskalet och grädda cirka 30 minuter.

=== Skinka- och ostpaj ===
1. Sätt ugnen på 200°C. Nagga pajdegen och förgrädda den i formen cirka 10 minuter.
2. Fördela tärnad skinka i pajskalet.
3. Vispa ihop ägg och grädde, rör i riven ost, häll över skinkan och grädda cirka 30 minuter tills smeten stelnat.

=== Svamppaj ===
1. Sätt ugnen på 200°C. Nagga pajdegen och förgrädda den i formen cirka 10 minuter.
2. Skiva svampen och löken och stek gyllenbruna i smör, låt svalna något.
3. Vispa ihop ägg och grädde, rör i svamp, lök och ost, häll i pajskalet och grädda cirka 30 minuter.

=== Tomat- och mozzarellapaj ===
1. Sätt ugnen på 200°C. Nagga pajdegen och förgrädda den i formen cirka 10 minuter.
2. Skiva tomaterna och mozzarellan.
3. Vispa ihop ägg och grädde, häll i pajskalet, varva med tomat och mozzarella och toppa med basilika. Grädda cirka 30 minuter tills smeten stelnat.`;

  // Viktad lottning utan återläggning: favoriter har favoriteWeight gånger större chans.
  function weightedDraw(list, count) {
    const pool = list.slice();
    const result = [];
    while (result.length < count && pool.length > 0) {
      let total = 0;
      pool.forEach(function(d) { total += d.favorite ? favoriteWeight : 1; });
      let r = Math.random() * total;
      let idx = pool.length - 1;
      for (let i = 0; i < pool.length; i++) {
        r -= pool[i].favorite ? favoriteWeight : 1;
        if (r < 0) { idx = i; break; }
      }
      result.push(pool.splice(idx, 1)[0]);
    }
    return result;
  }

    if (n === favoriteWeight) return;
    favoriteWeight = n;

    const newName = nameEl.value.trim();

    if (!newName) {
      candEditDraft = { name: nameEl.value, ingredients: ingRaw, recipe: recRaw, tags: tagRaw };
      candEditError = 'Rätten behöver ett namn.';
      render();
      return;
    }
    const clash = dishes.find(function(d) { return d !== dish && d.name.toLowerCase() === newName.toLowerCase(); });
    if (clash) {
      candEditDraft = { name: newName, ingredients: ingRaw, recipe: recRaw, tags: tagRaw };
      candEditError = 'Det finns redan en rätt som heter så.';
      render();
      return;
    }
    dish.ingredients = ingRaw.split(',').map(function(s) { return s.trim(); }).filter(Boolean).map(parseIngredient);

    const m = str.match(/^(\d+(?:[.,]\d+)?)\s*([a-zA-ZåäöÅÄÖ]*)\s+(.+)$/);
    if (m) {
      return { amount: parseFloat(m[1].replace(',', '.')), unit: (m[2] || '').toLowerCase(), name: m[3].trim() };
    }
    return { amount: null, unit: '', name: str };
  }

  function normalizeDishes(raw) {
    if (!Array.isArray(raw)) return [];
    return raw.map(function(d) {
      if (typeof d === 'string') return { name: d, ingredients: [], favorite: false, recipe: '', tags: [] };
      const ingredients = Array.isArray(d.ingredients) ? d.ingredients.map(function(ing) {
        if (typeof ing === 'string') return parseIngredient(ing);
        return ing;
      }) : [];
      const tags = Array.isArray(d.tags) ? d.tags.filter(Boolean).map(function(t) { return String(t).trim().toLowerCase(); }) : [];
      return { name: d.name || '', ingredients: ingredients, favorite: !!d.favorite, recipe: d.recipe || '', tags: tags };
    }).filter(function(d) { return d.name; });
  }

  function tagsToString(tags) { return (tags || []).join(', '); }

  function parseTagsInput(text) {
    return (text || '').split(',').map(function(t) { return t.trim().toLowerCase(); }).filter(Boolean);
  }

  function ingredientsToString(ingredients) {
    return ingredients.map(function(ing) {
      const prefix = ing.amount != null ? (ing.amount + (ing.unit ? ' ' + ing.unit : '') + ' ') : '';
      return prefix + ing.name;
    }).join(', ');
  }

  function dishesToText() {
    return dishes.map(function(d) {
      const star = d.favorite ? '★ ' : '';
      let line;
      if (d.ingredients.length === 0) line = star + d.name;
      else {
        const ingStr = d.ingredients.map(function(ing) {
          const prefix = ing.amount != null ? (ing.amount + (ing.unit ? ' ' + ing.unit : '') + ' ') : '';
          return prefix + ing.name;
        }).join(', ');
        line = star + d.name + ': ' + ingStr;
      }
      if (d.recipe) line += ' @recipe: ' + d.recipe.replace(/\n/g, '\\n');
      if (d.tags && d.tags.length) line += ' @tags: ' + d.tags.join(', ');
      return line;
    }).join('\n');
  }

  // flytta hela appens innehåll (rätter, planering, inköpslista, inställningar)
  // till en annan telefon eller dator genom att skicka över en fil.
  const ALL_STORAGE_KEYS = [
    'dishes', 'candidates', 'selected', 'staples', 'extraItems', 'shopChecked',
    'drawCount', 'lightDrawCount', 'baseServings', 'planAssignments', 'rejected',
    'favoriteWeight', 'excludedCategories', 'excludedLightCategories'

  async function exportAllData() {
    const payload = { __middagslotteriet_backup: true, version: 1, exportedAt: new Date().toISOString(), data: {} };
    for (const key of ALL_STORAGE_KEYS) {
      const v = await storage.get(key);
      if (v === null) continue;
      // Varje nyckel är sparad som en rå sträng i localStorage (listor/objekt
      // är redan JSON-strängar). Parsa upp dem igen innan de läggs i payload,
      // annars blir hela filen en enda dubbel-kodad, oläsbar textrad.
      try { payload.data[key] = JSON.parse(v.value); }
      catch (e) { payload.data[key] = v.value; }
    }
    const text = JSON.stringify(payload, null, 2);
    const blob = new Blob([text], { type: 'application/json;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const stamp = new Date().toISOString().slice(0, 10);
    a.href = url;
    a.download = 'middagslotteriet_allt_' + stamp + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    statusMsg = 'Allt exporterat (' + dishes.length + ' rätter + planering + inställningar). Skicka filen till din andra enhet och importera den där.';

  function importAllFile(fileInput) {
    const file = fileInput.files && fileInput.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async function(e) {
      try {
        const parsed = JSON.parse(e.target.result);
        if (!parsed || typeof parsed.data !== 'object') throw new Error('filen verkar inte vara en giltig Middagslotteriet-backup.');
        const ok = confirm('Detta skriver över ALLT som finns i appen just nu på den här enheten — rätter, planering, inköpslista och inställningar — med innehållet i filen "' + file.name + '". Går inte att ångra. Vill du fortsätta?');
        if (!ok) { fileInput.value = ''; return; }
        for (const key of Object.keys(parsed.data)) {
          const v = parsed.data[key];
          // Nyare backuper har riktiga värden (nummer/listor/objekt) här;
          // äldre backuper (innan denna fix) hade redan JSON-strängar.
          // Stödja båda: localStorage vill alltid ha en sträng.
          const str = (typeof v === 'string') ? v : JSON.stringify(v);
          await storage.set(key, str);
        }
        await loadState();
        statusMsg = 'Allt importerat från backup — ' + dishes.length + ' rätter, planering och inställningar återställda.';
        render();
      } catch (err) {
        statusMsg = 'Kunde inte importera filen: ' + (err && err.message ? err.message : 'okänt fel');
        render();
      }
      fileInput.value = '';
    };
    reader.readAsText(file);
  }

  async function loadState() {
    // Första gången appen öppnas på en enhet finns inget sparat under 'dishes' alls
    // (storage.get returnerar null, skiljer sig från en tömd/sparad tom lista).
    // Just då fylls listan med startdata — rätter, taggar och några exempelrecept —
    // så appen inte känns helt tom. Händer bara den allra första gången.
    try {
      const d = await storage.get('dishes');
      if (d) {
        dishes = normalizeDishes(JSON.parse(d.value));
      } else {
        dishes = buildDefaultDishes();
        try { await storage.set('dishes', JSON.stringify(dishes)); } catch (e) { /* best effort */ }
      }
    } catch (e) { dishes = []; }
    try { const c = await storage.get('candidates'); candidates = c ? JSON.parse(c.value) : []; } catch (e) { candidates = []; }
    try { const s = await storage.get('selected'); selected = s ? JSON.parse(s.value) : []; } catch (e) { selected = []; }
    try {
      const st = await storage.get('staples');
      staples = st ? JSON.parse(st.value).map(function(x) { return typeof x === 'string' ? parseIngredient(x) : x; }) : [];
    } catch (e) { staples = []; }
    try { const ei = await storage.get('extraItems'); extraItems = ei ? JSON.parse(ei.value) : []; } catch (e) { extraItems = []; }
    try { const sc = await storage.get('shopChecked'); shopChecked = sc ? JSON.parse(sc.value) : {}; } catch (e) { shopChecked = {}; }
    try {
      const dc = await storage.get('drawCount');
      drawCount = dc ? (parseInt(dc.value, 10) || DEFAULT_DRAW_COUNT) : DEFAULT_DRAW_COUNT;
    } catch (e) { drawCount = DEFAULT_DRAW_COUNT; }
    try {
      const ldc = await storage.get('lightDrawCount');
      lightDrawCount = ldc ? (parseInt(ldc.value, 10) || 0) : 0;
    } catch (e) { lightDrawCount = 0; }
    try {
      const bs = await storage.get('baseServings');
      baseServings = bs ? (parseInt(bs.value, 10) || 4) : 4;
    } catch (e) { baseServings = 4; }
    try { const pa = await storage.get('planAssignments'); planAssignments = pa ? JSON.parse(pa.value) : {}; } catch (e) { planAssignments = {}; }
    try { const rj = await storage.get('rejected'); rejected = rj ? JSON.parse(rj.value) : []; } catch (e) { rejected = []; }
    try {
      const fw = await storage.get('favoriteWeight');
      favoriteWeight = fw ? Math.min(10, Math.max(2, parseInt(fw.value, 10) || 4)) : 4;
    } catch (e) { favoriteWeight = 4; }
    try { const ft = await storage.get('excludedCategories'); excludedCategories = ft ? JSON.parse(ft.value) : []; } catch (e) { excludedCategories = []; }
    try { const flt = await storage.get('excludedLightCategories'); excludedLightCategories = flt ? JSON.parse(flt.value) : []; } catch (e) { excludedLightCategories = []; }
    migrateLunchesToExtras();
    reconcileSelectedIntoMenu();
    ensureMenuDishesInCandidates();
    loaded = true;
    render();
  }

  function addDish(name, ingredientsRaw, favorite, recipe, tagsRaw) {

    } else {

  async function clearShoppingTripAndRedraw() {
    if (dishes.length === 0) {

    if (pool.length === 0) { pool = dishes; fellBack = true; }
    // Lätta rätter (sallader, smörgåsar, tillbehör — taggade "lätt rätt") lottas ur en
    // egen pott parallellt med middagarna, så de inte konkurrerar om samma platser.
    const mainPool = pool.filter(function(d) { return !isLightDish(d); });
    const lightPool = pool.filter(isLightDish);
    const chosenMain = weightedDraw(mainPool, Math.min(drawCount, mainPool.length));
    const chosenLight = weightedDraw(lightPool, Math.min(lightDrawCount, lightPool.length));
    candidates = chosenMain.concat(chosenLight).map(function(d) { return d.name; });
    selected = [];

      ? 'Inga rätter matchar filtret just nu — lottade bland alla rätter i stället.'

    await persistTripState();

  // Behåll ikryssade rätter, lotta om resten (fyller upp till valt antal).
  async function redrawKeepSelected() {
    listMsg = '';
    const keep = candidates.filter(function(n) { return selected.indexOf(n) >= 0 && findDish(n); });
    if (keep.length === 0) {
      statusMsg = 'Kryssa i minst en rätt du vill behålla.';
      render();
      return;
    }
    const dropped = candidates.filter(function(n) { return keep.indexOf(n) < 0; });
    dropped.forEach(function(n) { if (rejected.indexOf(n) < 0) rejected.push(n); });
    // Håll isär middagar och lätta rätter så ombyte fyller på rätt pott (inte en lätt
    // rätt istället för en middag, eller tvärtom).
    const keepMain = keep.filter(function(n) { const d = findDish(n); return !(d && isLightDish(d)); });
    const keepLight = keep.filter(function(n) { const d = findDish(n); return d && isLightDish(d); });
    const needMain = Math.min(drawCount, dishes.filter(function(d) { return !isLightDish(d); }).length) - keepMain.length;
    const needLight = Math.min(lightDrawCount, dishes.filter(isLightDish).length) - keepLight.length;
    let namesMain = [];
    let namesLight = [];
    function available(d, names) { return keep.indexOf(d.name) < 0 && names.indexOf(d.name) < 0; }
    function take(pool, need, names) {
      if (names.length >= need) return names;
      return names.concat(weightedDraw(pool, need - names.length).map(function(d) { return d.name; }));
    }
    function fillPool(need, names, isLight) {
      if (need <= 0) return names;
      const filtered = filteredDishes().filter(function(d) { return isLightDish(d) === isLight; });
      names = take(filtered.filter(function(d) { return available(d, names) && rejected.indexOf(d.name) < 0; }), need, names);
      if (names.length < need) {
        // slut på orörda rätter inom filtret — glöm äldre bortvalda, men inte de du just valde bort
        rejected = dropped.slice();
        names = take(filtered.filter(function(d) { return available(d, names) && rejected.indexOf(d.name) < 0; }), need, names);
      }
      if (names.length < need) names = take(filtered.filter(function(d) { return available(d, names); }), need, names);
      if (names.length < need) {
        // filtret räcker inte ens då — fyll på från alla rätter i samma lätt/tung-kategori
        const allOfType = dishes.filter(function(d) { return isLightDish(d) === isLight; });
        names = take(allOfType.filter(function(d) { return available(d, names); }), need, names);
      }
      return names;
    }
    namesMain = fillPool(needMain, namesMain, false);
    namesLight = fillPool(needLight, namesLight, true);
    candidates = keepMain.concat(namesMain).concat(keepLight).concat(namesLight);
    selected = selected.filter(function(n) { return keep.indexOf(n) >= 0; });
    statusMsg = '';
    await persistTripState();
    render();
  }

  // "Lotta en ny rätt": byt en enda (ej vald) rätt mot en ny, på samma plats i listan.
  async function swapCandidate(name) {
    listMsg = '';
    const idx = candidates.indexOf(name);
    if (idx < 0 || selected.indexOf(name) >= 0) return;
    if (rejected.indexOf(name) < 0) rejected.push(name);
    const wasLight = isLightDish(findDish(name) || {});
    const sameType = function(d) { return isLightDish(d) === wasLight; };
    const filtered = filteredDishes().filter(sameType);
    let pool = filtered.filter(function(d) { return candidates.indexOf(d.name) < 0 && rejected.indexOf(d.name) < 0; });
    if (pool.length === 0) pool = filtered.filter(function(d) { return candidates.indexOf(d.name) < 0; });
    if (pool.length === 0) pool = dishes.filter(sameType).filter(function(d) { return candidates.indexOf(d.name) < 0; });
    if (pool.length === 0) {
      statusMsg = 'Det finns inga andra rätter att byta till.';
      render();
      return;
    }
    candidates[idx] = weightedDraw(pool, 1)[0].name;
    statusMsg = '';
    await persistTripState();
    render();
  }

  async function updateDrawCount(value) {
