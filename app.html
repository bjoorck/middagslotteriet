<style>
  :root {
    --bg: #f8ecea;
    --card: #fffbfa;
    --card-line: #e8d3ce;
    --chalk: #3a2429;
    --chalk-dim: #8a6d6a;
    --mustard: #c6883c;
    --sage: #a15c6b;
    --rust: #a6432c;
  }
  * { box-sizing: border-box; }
  #root {
    background: var(--bg);
    background-image:
      radial-gradient(ellipse at top left, rgba(255,214,214,0.55), transparent 60%),
      radial-gradient(ellipse at bottom right, rgba(161,92,107,0.08), transparent 60%);
    color: var(--chalk);
    font-family: 'Work Sans', sans-serif;
    min-height: 100vh;
    padding: 48px 20px 64px;
    display: flex;
    justify-content: center;
  }
  .wrap { width: 100%; max-width: 600px; }
  h1 {
    font-family: 'Fraunces', serif; font-weight: 600; font-style: italic;
    font-size: 2.4rem; text-align: center; margin: 0 0 6px;
  }
  .subtitle { text-align: center; color: var(--chalk-dim); font-size: 0.95rem; margin: 0 0 40px; }
  .board {
    border: 1px solid var(--card-line); background: var(--card); border-radius: 4px;
    padding: 32px 28px; position: relative;
  }
  .board::before {
    content: ""; position: absolute; inset: 8px;
    border: 1px solid rgba(58,36,41,0.08); border-radius: 2px; pointer-events: none;
  }
  .empty-state { text-align: center; color: var(--chalk-dim); padding: 20px 0 8px; line-height: 1.6; }

  .onboarding { padding: 8px 4px 4px; }
  .onboarding-title {
    font-family: 'Fraunces', serif; font-weight: 600; font-size: 1.15rem;
    text-align: center; margin-bottom: 16px; line-height: 1.4;
  }
  .onboarding-steps { margin: 0; padding-left: 22px; color: var(--chalk); line-height: 1.7; }
  .onboarding-steps li { margin-bottom: 6px; }
  button { font-family: 'Work Sans', sans-serif; cursor: pointer; border: none; }
  .draw-btn {
    width: 100%; background: var(--mustard); color: #201505; font-weight: 600;
    font-size: 1rem; padding: 15px; border-radius: 3px;
    transition: transform 0.12s ease, background 0.12s ease;
  }
  .draw-btn:hover { background: #e5b458; }
  .draw-btn:active { transform: scale(0.98); }
  .draw-btn:disabled { opacity: 0.5; cursor: default; }

  .draw-btn-blue {
    width: 100%; background: #3f6fa8; color: #fdfbf5; font-weight: 600;
    font-size: 1rem; padding: 15px; border-radius: 3px;
    transition: transform 0.12s ease, background 0.12s ease;
  }
  .draw-btn-blue:hover { background: #4a80bd; }
  .draw-btn-blue:active { transform: scale(0.98); }

  .draw-btn-dark {
    width: 100%; background: var(--chalk); color: #fdfbf5; font-weight: 600;
    font-size: 1rem; padding: 15px; border-radius: 3px;
    transition: transform 0.12s ease, background 0.12s ease;
  }
  .draw-btn-dark:hover { background: #4d3238; }
  .draw-btn-dark:active { transform: scale(0.98); }

  .select-count { text-align: center; font-size: 0.8rem; color: var(--mustard); margin: 14px 0 4px; letter-spacing: 0.3px; }

  .filter-panel {
    border: 1px solid rgba(161,92,107,0.35); background: rgba(161,92,107,0.06);
    border-radius: 6px; padding: 14px 16px; margin-bottom: 14px;
  }
  .filter-chip-row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .filter-chip {
    background: #fffbfa; border: 1px solid rgba(198,136,60,0.4); color: var(--chalk-dim);
    font-size: 0.82rem; padding: 6px 12px; border-radius: 14px;
  }
  .filter-chip:hover { background: rgba(198,136,60,0.15); }
  .filter-chip.is-only { background: var(--mustard); border-color: var(--mustard); color: #201505; font-weight: 600; }
  .filter-chip.is-not { background: var(--rust); border-color: var(--rust); color: #fff6f2; font-weight: 600; }
  .draw-count-box {
    border: 1px solid rgba(161,92,107,0.35); background: rgba(161,92,107,0.08);
    border-radius: 6px; padding: 14px 16px; margin-bottom: 14px; text-align: center;
  }
  .draw-count-label { font-size: 0.85rem; color: var(--chalk); margin-bottom: 10px; }
  .draw-count-stepper { display: flex; align-items: center; justify-content: center; gap: 16px; }
  .draw-count-stepper button {
    background: var(--sage); color: #fdfbf5; font-size: 1.1rem; font-weight: 700;
    width: 34px; height: 34px; border-radius: 6px; display: flex; align-items: center; justify-content: center; padding: 0;
  }
  .draw-count-stepper button:hover { background: #8f4f5c; }
  .draw-count-value { font-family: 'Fraunces', serif; font-weight: 600; font-size: 1.3rem; min-width: 32px; }

  .candidate-list { margin-top: 14px; display: flex; flex-direction: column; gap: 2px; }
  .candidate-row {
    position: relative; padding: 18px 10px 18px 36px;
    border-bottom: 1px solid rgba(58,36,41,0.08); border-radius: 3px;
  }
  .candidate-row:last-child { border-bottom: none; }
  .candidate-row.is-checked { background: rgba(198,136,60,0.08); }
  .fav-corner {
    position: absolute; left: 8px; top: 19px; width: 24px; height: 24px; padding: 0;
    border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: 0.85rem; line-height: 1; background: rgba(198,136,60,0.10);
    border: 1px solid rgba(198,136,60,0.4); color: var(--chalk-dim);
  }
  .fav-corner:hover { background: rgba(198,136,60,0.22); }
  .fav-corner.is-fav { background: var(--mustard); border-color: var(--mustard); color: #201505; font-weight: 600; }
  .count-btn { font-weight: 700; min-width: 42px; }
  .count-btn.c1 { background: var(--mustard); border-color: var(--mustard); color: #201505; }
  .count-btn.c2 { background: #8a5a1f; border-color: #8a5a1f; color: #fff6e6; }
  .candidate-tap { cursor: pointer; height: 70px; overflow: hidden; }
  .item-remove { background: none; color: var(--rust); font-size: 1rem; padding: 8px 10px; margin-left: auto; flex-shrink: 0; }
  .item-edit { background: none; color: var(--chalk-dim); font-size: 0.95rem; padding: 8px 6px 8px 0; flex-shrink: 0; }
  .item-edit:hover { color: var(--mustard); }
  .extra-edit-row { display: flex; gap: 8px; align-items: center; flex: 1; }
  .candidate-fav-row { margin-top: 10px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-left: -26px; width: calc(100% + 26px); }
  .portion-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
  .portion-label { font-size: 0.8rem; color: var(--chalk-dim); min-width: 46px; }
  .servings-btn.lg { width: 34px; height: 34px; font-size: 1.1rem; }
  .more-action { background: #f7e9e5; border: 1px solid var(--card-line); color: var(--chalk); font-size: 0.88rem; font-weight: 600; padding: 11px 14px; border-radius: 4px; }
  .more-action:hover { background: rgba(198,136,60,0.15); }
  .fav-toggle.remove-btn { background: rgba(166,67,44,0.10); border-color: rgba(166,67,44,0.45); color: var(--rust); }
  .fav-toggle.remove-btn:hover { background: rgba(166,67,44,0.22); }
  .weight-ctl { display: inline-flex; align-items: center; gap: 8px; margin: 0 4px; vertical-align: middle; }

  const DEFAULT_RECIPES_TEXT = `=== Köttbullar med potatismos ===
1. Riv eller finhacka löken. Blanda ströbröd och mjölk i en skål och låt svälla 5 minuter.
2. Blanda köttfärs, ägg, den svällda ströbrödsblandningen, lök, salt och peppar. Arbeta smeten smidig med en gaffel eller händerna.
3. Forma smeten till köttbullar med våta händer, ungefär lagom stora för en tugga.
4. Hetta upp smör i en stekpanna på medelvärme. Stek köttbullarna i omgångar, rulla runt dem så de bryns jämnt, cirka 8–10 minuter tills de är genomstekta.
5. Under tiden: skala och koka potatisen mjuk i lättsaltat vatten, cirka 20 minuter. Häll av vattnet.
6. Mosa potatisen, tillsätt mjölk och smör lite i taget och rör till en jämn mos. Smaka av med salt.
7. Servera köttbullarna med potatismoset, gärna med lingonsylt och pressgurka vid sidan om.

=== Kalops ===
1. Skär eventuellt grytbitarna lite mindre om de är stora. Skala och dela löken i klyftor, skala morötterna och skär i bitar.
2. Vänd köttet i vetemjölet.
3. Bryn köttet i omgångar i smör i en gryta på hög värme tills det fått fin färg. Ta upp och lägg åt sidan.
4. Bryn löken i samma gryta ett par minuter.
5. Lägg tillbaka köttet, tillsätt morötter, kryddpepparkorn, lagerblad, buljong, salt och vatten. Vattnet ska nästan täcka innehållet.
6. Låt sjuda under lock på svag värme i 2–2,5 timmar, tills köttet är mört. Rör om då och då och fyll på lite vatten om det kokar in för mycket.
7. Smaka av med mer salt om det behövs. Ta bort lagerbladen före servering.
8. Koka potatisen mjuk i lättsaltat vatten under tiden. Servera kalopsen med kokt potatis och gärna lingonsylt.

=== Pannbiff med lök ===
1. Blanda ströbröd och mjölk, låt svälla 5 minuter.
2. Blanda nötfärs, ägg, den svällda smeten, salt och peppar. Arbeta ihop till en jämn smet.
3. Skala löken och skär i tunna ringar eller halvmånar.
4. Fräs löken i en msk smör på medelvärme tills den är mjuk och gyllene, cirka 8 minuter. Ta upp och ställ åt sidan.
5. Forma färsen till fyra platta biffar.
6. Stek biffarna i resten av smöret, 3–4 minuter per sida, tills de är genomstekta.
7. Koka potatisen mjuk i lättsaltat vatten under tiden, häll av vattnet och tillsätt mjölk, mosa lätt eller servera hela.
8. Lägg löken ovanpå biffarna och servera med potatisen.

=== Kåldolmar ===
1. Ta bort de yttre grova bladen på vitkålen. Koka upp lättsaltat vatten i en stor gryta och lägg i kålhuvudet, koka 5–8 minuter tills bladen mjuknar och går lätt att lossa. Lossa bladen försiktigt allt eftersom, ett i taget, och låt dem svalna. Skär bort den grova mittnerven på varje blad.
2. Koka riset enligt paketets anvisningar och låt svalna något.
3. Blanda köttfärs, kokt ris, ägg, mjölk, salt och peppar till en jämn smet.
4. Lägg en klick färs på varje kålblad, vik in kanterna och rulla ihop till ett paket.
5. Bryn kåldolmarna runt om i smör i en stekpanna, lägg dem sedan i en ugnsform.
6. Ringla över lönnsirap och häll på lite vatten i botten av formen.
7. Grädda i ugn, 175 grader, cirka 30–40 minuter tills de är genomstekta.
8. Koka potatisen under tiden. Servera kåldolmarna med kokt potatis, sky och gärna lingonsylt.

=== Lasagne ===
1. Skala och finhacka löken och vitlöken.

    }

  function removeDish(name) {
    dishes = dishes.filter(function(d) { return d.name !== name; });
    candidates = candidates.filter(function(n) { return n !== name; });
    selected = selected.filter(function(n) { return n !== name; });
    if (editingDishName === name) editingDishName = null;
    if (candEditName === name) candEditName = null;
    confirmRemoveName = null;
    Object.keys(planAssignments).forEach(function(k) {
      if (planAssignments[k] && planAssignments[k].name === name) delete planAssignments[k];
    });
    persistTripState();
    persistDishesQuiet('"' + name + '" borttagen.');
  }

  async function persistTripState() {
    compactDays();
    syncSelected();
    try {
      await storage.set('candidates', JSON.stringify(candidates));
      await storage.set('selected', JSON.stringify(selected));
      await storage.set('planAssignments', JSON.stringify(planAssignments));
      await storage.set('extraItems', JSON.stringify(extraItems));
      await storage.set('shopChecked', JSON.stringify(shopChecked));
      await storage.set('rejected', JSON.stringify(rejected));
    } catch (e) { /* non-critical */ }
  }

  async function clearShoppingTripAndRedraw() {
    if (dishes.length === 0) {
      statusMsg = 'Du behöver minst någon rätt i listan.';
      render();
      return;
    }
    planAssignments = {};
    recipeOpenName = null;
    listMsg = '';
    shareFallbackText = '';
    editingExtraIndex = null;
    confirmNewWeek = null;
    rejected = [];
    extraItems = [];
    shopChecked = {};
    lastChecked = null;
    let pool = filteredDishes();
    let fellBack = false;
    if (pool.length === 0) { pool = dishes; fellBack = true; }
    const chosen = weightedDraw(pool, Math.min(drawCount, pool.length));
    candidates = chosen.map(function(d) { return d.name; });
    selected = [];
    statusMsg = fellBack
      ? 'Inga rätter matchar filtret just nu — lottade bland alla rätter i stället.'
      : 'Ny vecka — allt tömt och nya rätter lottade.';
    await persistTripState();
    render();
  }

  // Ny lottning börjar alltid om från noll: tömmer valda rätter, inköpslista och avbockningar.
  async function drawCandidates() {
    await clearShoppingTripAndRedraw();
  }

  function hasWeekData() {
    return selected.length > 0 ||
      Object.keys(planAssignments).length > 0 ||
      extraItems.length > 0 ||
      Object.keys(shopChecked).some(function(k) { return shopChecked[k]; });
  }

  // Frågar först om det finns något som skulle försvinna.
  function requestNewWeek(where) {
    if (dishes.length === 0) {
      statusMsg = 'Du behöver minst någon rätt i listan.';
      render();
      return;
    }
    if (!hasWeekData()) { clearShoppingTripAndRedraw().then(scrollToTop); return; }
    confirmNewWeek = where;
    render();
    // Bekräftelsen hamnar under knappen — se till att den syns även om knappen ligger nära skärmens nederkant.
    const el = document.getElementById('newWeekConfirm');
    if (el && el.scrollIntoView) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  function scrollToTop() {
    if (typeof window.scrollTo === 'function') window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function cancelNewWeek() { confirmNewWeek = null; render(); }

  async function confirmNewWeekDo() {
    confirmNewWeek = null;
    await clearShoppingTripAndRedraw();
    scrollToTop(); // visa de nya lottade rätterna högst upp
  }

  function newWeekConfirmHtml() {
    const parts = [];
    if (selected.length) parts.push(selected.length + ' valda rätter');
    const checkedCount = Object.keys(shopChecked).filter(function(k) { return shopChecked[k]; }).length;
    if (checkedCount) parts.push(checkedCount + ' avbockade varor');
    if (extraItems.length) parts.push(extraItems.length + ' egna varor');
    let h = '<div class="confirm-inline" id="newWeekConfirm"><strong>Börja ny vecka?</strong> ';
    if (parts.length) h += 'Du har ' + parts.join(', ') + '. ';
    h += 'Allt det töms och helt nya rätter lottas. Det går inte att ångra.';
    h += '<div class="row"><button class="danger-btn" onclick="confirmNewWeekDo()">Ja, börja ny vecka</button><button class="link-btn" onclick="cancelNewWeek()">Avbryt</button></div></div>';
    return h;
  }

  // Behåll ikryssade rätter, lotta om resten (fyller upp till valt antal).
  async function redrawKeepSelected() {
    listMsg = '';
    const keep = candidates.filter(function(n) { return selected.indexOf(n) >= 0 && findDish(n); });
    if (keep.length === 0) {
      statusMsg = 'Kryssa i minst en rätt du vill behålla.';
      render();
      return;
    }
    const dropped = candidates.filter(function(n) { return keep.indexOf(n) < 0; });
    dropped.forEach(function(n) { if (rejected.indexOf(n) < 0) rejected.push(n); });
    const need = Math.min(drawCount, dishes.length) - keep.length;
    let names = [];
    function available(d) { return keep.indexOf(d.name) < 0 && names.indexOf(d.name) < 0; }
    function take(pool) {
      if (names.length >= need) return;
      names = names.concat(weightedDraw(pool, need - names.length).map(function(d) { return d.name; }));
    }
    if (need > 0) {
      const filtered = filteredDishes();
      take(filtered.filter(function(d) { return available(d) && rejected.indexOf(d.name) < 0; }));
      if (names.length < need) {
        // slut på orörda rätter inom filtret — glöm äldre bortvalda, men inte de du just valde bort
        rejected = dropped.slice();
        take(filtered.filter(function(d) { return available(d) && rejected.indexOf(d.name) < 0; }));
      }
      if (names.length < need) take(filtered.filter(available));
      if (names.length < need) {
        // filtret räcker inte ens då — fyll på från alla rätter så listan ändå blir full
        take(dishes.filter(available));
      }
    }
    candidates = keep.concat(names);
    selected = selected.filter(function(n) { return keep.indexOf(n) >= 0; });
    statusMsg = '';
    await persistTripState();
    render();
  }

  // "Lotta en ny rätt": byt en enda (ej vald) rätt mot en ny, på samma plats i listan.
  async function swapCandidate(name) {
    listMsg = '';
    const idx = candidates.indexOf(name);
    if (idx < 0 || selected.indexOf(name) >= 0) return;
    if (rejected.indexOf(name) < 0) rejected.push(name);
    const filtered = filteredDishes();
    let pool = filtered.filter(function(d) { return candidates.indexOf(d.name) < 0 && rejected.indexOf(d.name) < 0; });
    if (pool.length === 0) pool = filtered.filter(function(d) { return candidates.indexOf(d.name) < 0; });
    if (pool.length === 0) pool = dishes.filter(function(d) { return candidates.indexOf(d.name) < 0; });
    if (pool.length === 0) {
      statusMsg = 'Det finns inga andra rätter att byta till.';
      render();
      return;
    }
    candidates[idx] = weightedDraw(pool, 1)[0].name;
    statusMsg = '';
    await persistTripState();
    render();
  }

  async function updateDrawCount(value) {
    let n = parseInt(value, 10);
    if (!n || n < 1) n = 1;
    if (n > 20) n = 20;
    drawCount = n;
    render();
    try { await storage.set('drawCount', String(drawCount)); } catch (e) { /* non-critical */ }
  }

  const MIN_SERVINGS = 1;
  const MAX_SERVINGS = 20;

  // Veckomenyn är enda sanningen: `selected` är bara en spegling av vad som ligger i menyn.
  // Menyn har en middag per dag (7 rutor). Luncher finns inte längre — sådana rätter läggs som "Extra".
  const DINNER = 'Middag';     // plats 1 på dagen
  const DINNER2 = 'Middag2';   // plats 2 på dagen (max två rätter per dag)

  function slotOrder(key) {
    const parts = key.split('|');
    if (parts[0] === 'Extra') return 1000 + (parseInt(parts[1], 10) || 0);
    return DAY_OPTIONS.indexOf(parts[0]) * 2 + (parts[1] === DINNER2 ? 1 : 0);
  }

  // "Extra rätter": val som inte fick plats bland dagarna (eller som inte ska ha en fast dag). Ligger i samma
  // lista som menyn (nycklar "Extra|1", "Extra|2" ...) och räknas därför automatiskt med på inköpslistan.
  function isExtraKey(key) { return key.indexOf('Extra|') === 0; }

  function extraKeys() {
    return Object.keys(planAssignments).filter(function(k) {
      return isExtraKey(k) && planAssignments[k] && planAssignments[k].name;
    }).sort(function(a, b) { return slotOrder(a) - slotOrder(b); });
  }

  function nextExtraKey() {
    let max = 0;
    Object.keys(planAssignments).forEach(function(k) {
      if (isExtraKey(k)) max = Math.max(max, parseInt(k.split('|')[1], 10) || 0);
    });
    return 'Extra|' + (max + 1);
  }

  function addExtra(name) {
    planAssignments[nextExtraKey()] = { name: name, servings: baseServings };
  }

  function isDayFree(day) {
    const a = planAssignments[slotKey(day, DINNER)];
    return !(a && a.name);
  }

  function placeOnDay(day, name) {
    planAssignments[slotKey(day, DINNER)] = { name: name, servings: baseServings };
  }

  // Alla platser en rätt ligger på, i tidsordning (måndag först, extra sist).
  function slotsOf(name) {
    return Object.keys(planAssignments).filter(function(k) {
      return planAssignments[k] && planAssignments[k].name === name;
    }).sort(function(a, b) { return slotOrder(a) - slotOrder(b); });
  }

  function syncSelected() {
    selected = Object.keys(planAssignments).filter(function(k) {
      return planAssignments[k] && planAssignments[k].name;
    }).sort(function(a, b) { return slotOrder(a) - slotOrder(b); }).map(function(k) { return planAssignments[k].name; });
  }

  // Dag (t.ex. "Tisdag") för rättens första middag, annars null.
  function firstDayOf(name) {
    const k = slotsOf(name).filter(function(x) { return !isExtraKey(x); })[0];
    return k ? k.split('|')[0] : null;
  }

  // 1x: första lediga dag måndag→söndag.
  function placeSingle(name) {
    for (let i = 0; i < DAY_OPTIONS.length; i++) {
      if (isDayFree(DAY_OPTIONS[i])) { placeOnDay(DAY_OPTIONS[i], name); return true; }
    }
    return false;
  }

  // Andra portionen (rester): dagen efter den första om den är ledig, annars närmaste lediga dag efter, annars valfri ledig.
  function placeSecond(name) {
    const first = firstDayOf(name);
    const start = first ? DAY_OPTIONS.indexOf(first) : -1;
    for (let i = start + 1; i < DAY_OPTIONS.length; i++) {
      if (isDayFree(DAY_OPTIONS[i])) { placeOnDay(DAY_OPTIONS[i], name); return true; }
    }
    for (let i = 0; i <= start && i < DAY_OPTIONS.length; i++) {
      if (isDayFree(DAY_OPTIONS[i])) { placeOnDay(DAY_OPTIONS[i], name); return true; }
    }
    return false;
  }

  // 2x från noll: två dagar i rad på första lediga par, annars två valfria lediga dagar.
  function placePair(name) {
    for (let i = 0; i < DAY_OPTIONS.length - 1; i++) {
      if (isDayFree(DAY_OPTIONS[i]) && isDayFree(DAY_OPTIONS[i + 1])) {
        placeOnDay(DAY_OPTIONS[i], name);
        placeOnDay(DAY_OPTIONS[i + 1], name);
        return true;
      }
    }
    if (!placeSingle(name)) return false;
    return placeSecond(name);
  }

  function removePortions(name, n) {
    const slots = slotsOf(name);
    for (let i = 0; i < n && slots.length > 0; i++) delete planAssignments[slots.pop()];
  }

  async function setCandidateCount(name, desiredCount) {
    listMsg = '';
    const current = slotsOf(name).length;
    if (desiredCount === current) return;

    if (desiredCount < current) removePortions(name, current - desiredCount);
    else if (current === 0 && desiredCount === 2) placePair(name);
    else if (current === 0) placeSingle(name);
    else placeSecond(name);

    let missing = desiredCount - slotsOf(name).length;
    if (missing > 0) {
      while (missing-- > 0) addExtra(name);
      listMsg = 'Alla dagar har redan en rätt — rätten lades som "Extra (ingen dag)" och räknas ändå med på inköpslistan. Du kan välja dag för den med rullisten.';
    }

    statusMsg = '';
    await persistTripState();
    render();
  }

  // Ett tryck = 1x, två = 2x, tre = bort, fyra = 1x igen osv.
  function cycleCandidate(name) {
    const count = selected.filter(function(n) { return n === name; }).length;
    return setCandidateCount(name, count >= 2 ? 0 : count + 1);
  }

  // Om plats 1 en dag är tom men plats 2 är fylld flyttas rätten upp till plats 1.
  function compactDays() {
    DAY_OPTIONS.forEach(function(day) {
      const k1 = slotKey(day, DINNER);
      const k2 = slotKey(day, DINNER2);
      const a1 = planAssignments[k1];
      const a2 = planAssignments[k2];
      if (!(a1 && a1.name) && a2 && a2.name) { planAssignments[k1] = a2; delete planAssignments[k2]; }
      else if (a2 && !a2.name) delete planAssignments[k2];
    });
  }

  // Välj dag för en portion av en rätt direkt i lottningen ('Extra' = ingen fast dag).
  // which: 0 = första portionen (dag 1), 1 = andra portionen (rester) när du valt 2x.
  // Varje dag har två platser: är plats 1 upptagen hamnar rätten på plats 2; är båda upptagna byter den plats med plats 1.
  async function setDishDay(name, target, which) {
    listMsg = '';
    if (!target || !findDish(name)) { render(); return; }
    const slots = slotsOf(name);
    const idx = which === 1 ? 1 : 0;
    if (idx === 1 && slots.length < 2) { render(); return; }
    const fromKey = slots[idx] || null;

    if (target === 'Extra') {
      if (fromKey === null) {
        addExtra(name);
      } else if (!isExtraKey(fromKey)) {
        const moved = planAssignments[fromKey];
        delete planAssignments[fromKey];
        planAssignments[nextExtraKey()] = moved;
      }
    } else {
      const k1 = slotKey(target, DINNER);
      const k2 = slotKey(target, DINNER2);
      if (fromKey !== k1 && fromKey !== k2) {
        // Låg resterna dagen efter (vanlig standardplacering) ska de följa med när första portionen flyttas.
        const oldIdx = (fromKey && !isExtraKey(fromKey)) ? DAY_OPTIONS.indexOf(fromKey.split('|')[0]) : -1;
        const secondKey = (idx === 0 && slots.length === 2) ? slots[1] : null;
        const secondAdjacent = !!secondKey && !isExtraKey(secondKey) && oldIdx >= 0 &&
          DAY_OPTIONS.indexOf(secondKey.split('|')[0]) === oldIdx + 1;

        const moved = fromKey ? planAssignments[fromKey] : { name: name, servings: baseServings };
        const k1Free = !(planAssignments[k1] && planAssignments[k1].name);
        const k2Free = !(planAssignments[k2] && planAssignments[k2].name);
        if (k1Free || k2Free) {
          if (fromKey) delete planAssignments[fromKey];
          planAssignments[k1Free ? k1 : k2] = moved;
        } else {
          // båda platserna upptagna: byt plats med den första
          const occupant = planAssignments[k1];
          if (fromKey) {
            planAssignments[fromKey] = occupant;
          } else {
            let placed = false;
            for (let i = 0; i < DAY_OPTIONS.length && !placed; i++) {
              if (isDayFree(DAY_OPTIONS[i])) { planAssignments[slotKey(DAY_OPTIONS[i], DINNER)] = occupant; placed = true; }
            }
            if (!placed) planAssignments[nextExtraKey()] = occupant;
          }
          planAssignments[k1] = moved;
        }

        if (secondAdjacent) {
          const newIdx = DAY_OPTIONS.indexOf(target);
          if (newIdx >= 0 && newIdx < DAY_OPTIONS.length - 1 && isDayFree(DAY_OPTIONS[newIdx + 1])) {
            planAssignments[slotKey(DAY_OPTIONS[newIdx + 1], DINNER)] = planAssignments[secondKey];
            delete planAssignments[secondKey];
          }
        }
      }
    }

    statusMsg = '';
    await persistTripState();
    render();
  }

  // Rullista för dag i lottningslistan (which: 0 = dag 1, 1 = rester).
  function daySelectHtml(name, dayValue, which) {
    const nameAttr = JSON.stringify(name).replace(/"/g, '&quot;');
    let h = '<select class="day-select" onchange="setDishDay(' + nameAttr + ', this.value, ' + (which || 0) + ')" title="Välj vilken dag rätten ska lagas">';
    h += '<option value=""' + (dayValue === '' ? ' selected' : '') + '>Välj dag…</option>';
    DAY_OPTIONS.forEach(function(day) {
      const others = [DINNER, DINNER2].map(function(m) {
        const a = planAssignments[slotKey(day, m)];
        return (a && a.name && a.name !== name) ? (a.name.length > 14 ? a.name.slice(0, 13) + '…' : a.name) : null;
      }).filter(Boolean);
      const label = day + (others.length ? ' · ' + others.join(' + ') : '');
      h += '<option value="' + day + '"' + (dayValue === day ? ' selected' : '') + '>' + escapeHtml(label) + '</option>';
    });
    h += '<option value="Extra"' + (dayValue === 'Extra' ? ' selected' : '') + '>Extra (ingen dag)</option>';
    h += '</select>';
    return h;
  }

  // En rad i lottningslistan: rullista för dag + antal personer för just den portionen (när den är vald).
  function portionRowHtml(name, label, dayValue, which, key) {
    let h = '<div class="portion-row"><span class="portion-label">' + label + '</span>' + daySelectHtml(name, dayValue, which);
    if (key && planAssignments[key]) {
      const keyAttr = JSON.stringify(key).replace(/"/g, '&quot;');
      const n = planAssignments[key].servings || baseServings;
      h += '<span class="servings-stepper">' +
        '<button class="servings-btn lg" onclick="adjustKeyServings(' + keyAttr + ', -1)" title="Färre personer">−</button>' +
        '<span class="servings-label">' + n + ' pers.</span>' +
        '<button class="servings-btn lg" onclick="adjustKeyServings(' + keyAttr + ', 1)" title="Fler personer">+</button>' +
        '</span>';
    }
    return h + '</div>';
  }

  // Utan veckomeny finns bara lottningslistan att redigera i: se till att varje vald rätt har en rad där
  // (t.ex. gamla extra-rätter), och släng val som pekar på rätter som inte längre finns.
  function ensureMenuDishesInCandidates() {
    Object.keys(planAssignments).forEach(function(k) {
      const a = planAssignments[k];
      if (!(a && a.name)) return;
      if (!findDish(a.name)) { delete planAssignments[k]; return; }
      if (candidates.indexOf(a.name) < 0) candidates.push(a.name);
    });
    syncSelected();
  }

  // Sparad meny från tiden med luncher: lunchrätter flyttas till "Extra rätter".
  function migrateLunchesToExtras() {
    Object.keys(planAssignments).forEach(function(k) {
      if (k.split('|')[1] === 'Lunch') {
        const a = planAssignments[k];
        delete planAssignments[k];
        if (a && a.name) planAssignments[nextExtraKey()] = a;
      }
    });
  }

  async function saveBaseServings(value) {
    let n = parseInt(value, 10);
    if (!n || n < 1) n = 1;
    if (n > 20) n = 20;
    baseServings = n;
    render();
    const el = document.getElementById('baseServingsInput');
    if (el) el.focus();
    try { await storage.set('baseServings', String(baseServings)); } catch (e) { /* non-critical */ }
  }

  async function saveStaples(text) {
    const items = text.split(',').map(function(s) { return s.trim(); }).filter(Boolean).map(parseIngredient);
    staples = items;
    try {
      const result = await storage.set('staples', JSON.stringify(staples));
      if (!result) throw new Error('inget svar från lagringen');
      statusMsg = 'Basvaror sparade — ' + staples.length + ' varor.';
    } catch (e) {
      statusMsg = 'Kunde inte spara basvaror — försök igen. (' + (e && e.message ? e.message : 'okänt fel') + ')';
    }
    render();
  }

  const DAY_OPTIONS = ['Måndag', 'Tisdag', 'Onsdag', 'Torsdag', 'Fredag', 'Lördag', 'Söndag'];

  function slotKey(day, meal) { return day + '|' + meal; }

  async function adjustKeyServings(key, delta) {
    const a = planAssignments[key];
    if (!a) return;
    let next = (a.servings || baseServings) + delta;
    if (next < MIN_SERVINGS) next = MIN_SERVINGS;
    if (next > MAX_SERVINGS) next = MAX_SERVINGS;
    a.servings = next;
    await persistTripState();
    render();
  }

  function handleAddSearch(value) {
    addSearch = value;
    render();
    const el = document.getElementById('addLotInput');
    if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
  }

  // Lägg till en valfri rätt (som inte lottades) i lottningslistan och välj den 1x — den hamnar då i menyn.
  async function addToLot(name) {
    if (!findDish(name)) return;
    listMsg = '';
    if (candidates.indexOf(name) < 0) candidates.push(name);
    addSearch = '';
    await setCandidateCount(name, 1);
    await persistTripState();
    render();
  }

  // Äldre sparade val som saknar plats i menyn läggs in i menyn (menyn är enda sanningen).
  function reconcileSelectedIntoMenu() {
    const menuCounts = {};
    Object.keys(planAssignments).forEach(function(k) {
      const a = planAssignments[k];
      if (a && a.name) menuCounts[a.name] = (menuCounts[a.name] || 0) + 1;
    });
    const selCounts = {};
    selected.forEach(function(n) { selCounts[n] = (selCounts[n] || 0) + 1; });
    Object.keys(selCounts).forEach(function(name) {
      if (!findDish(name)) return;
      for (let i = (menuCounts[name] || 0); i < selCounts[name]; i++) {
        const placed = (i === 0) ? placeSingle(name) : placeSecond(name);
        if (!placed) addExtra(name);
      }
    });
    syncSelected();
  }

  function itemKey(ing) { return (ing.unit || '') + '|' + ing.name.toLowerCase(); }

  // Enheter som räknas om till en gemensam bas, så att t.ex. "500 g" och "0,5 kg" av
  // samma ingrediens blir en enda rad på inköpslistan i stället för två.
  const WEIGHT_TO_G = { g: 1, hg: 100, kg: 1000 };
  const VOLUME_TO_ML = { ml: 1, cl: 10, dl: 100, l: 1000, liter: 1000, tsk: 5, msk: 15 };

  function formatWeight(grams) {
    if (grams == null) return { amount: null, unit: '' };
    if (grams >= 1000) return { amount: grams / 1000, unit: 'kg' };
    return { amount: Math.round(grams), unit: 'g' };
  }

  function formatVolume(ml) {
    if (ml == null) return { amount: null, unit: '' };
    if (ml < 15) return { amount: ml / 5, unit: 'tsk' };
    if (ml < 100) return { amount: ml / 15, unit: 'msk' };
    if (ml < 1000) return { amount: ml / 100, unit: 'dl' };
    return { amount: ml / 1000, unit: 'l' };
  }

  function buildShoppingList() {
    const map = new Map();
    function addIngredient(ing) {
      const unitLow = (ing.unit || '').toLowerCase();
      let kind = null;
      let base = null;
      if (WEIGHT_TO_G[unitLow] != null) {
        kind = 'weight';
        base = ing.amount != null ? ing.amount * WEIGHT_TO_G[unitLow] : null;
      } else if (VOLUME_TO_ML[unitLow] != null) {
        kind = 'volume';
        base = ing.amount != null ? ing.amount * VOLUME_TO_ML[unitLow] : null;
      }
      const key = kind ? (kind === 'weight' ? 'W|' : 'V|') + ing.name.toLowerCase() : unitLow + '|' + ing.name.toLowerCase();
      const incoming = kind ? base : ing.amount;
      if (map.has(key)) {
        const existing = map.get(key);
        if (incoming != null && existing.amount != null) existing.amount += incoming;
        else existing.amount = null;
      } else {
        map.set(key, { name: ing.name, amount: incoming, unit: kind ? null : ing.unit, kind: kind });
      }
    }
    // Inköpslistan byggs bara från veckomenyn — varje ruta räknas med sina egna portioner.
    Object.keys(planAssignments).forEach(function(key) {
      const assignment = planAssignments[key];
      if (!assignment || !assignment.name) return;
      const dish = findDish(assignment.name);
      if (!dish) return;
      const servings = assignment.servings || baseServings;
      const mult = servings / baseServings;
      dish.ingredients.forEach(function(ing) {
        addIngredient({ amount: ing.amount != null ? ing.amount * mult : null, unit: ing.unit, name: ing.name });
      });
    });
    staples.forEach(addIngredient);
    extraItems.forEach(function(text) {
      const trimmed = (text || '').trim();
      if (trimmed) addIngredient(parseIngredient(trimmed));
    });
    const items = Array.from(map.values()).map(function(it) {
      if (it.kind === 'weight') {
        const f = formatWeight(it.amount);
        return { name: it.name, amount: f.amount, unit: f.unit };
      }
      if (it.kind === 'volume') {
        const f = formatVolume(it.amount);
        return { name: it.name, amount: f.amount, unit: f.unit };
      }
      return { name: it.name, amount: it.amount, unit: it.unit };
    });
    return items.sort(function(a, b) {
      const catA = getCategoryIndex(a.name);
      const catB = getCategoryIndex(b.name);
      if (catA !== catB) return catA - catB;
      return a.name.localeCompare(b.name, 'sv');
    });
  }

  function getCategoryIndex(name) {
    const lower = name.toLowerCase();
    for (let i = 0; i < SHOPPING_CATEGORIES.length; i++) {
      const keywords = SHOPPING_CATEGORIES[i];
      for (let j = 0; j < keywords.length; j++) {
        if (lower.indexOf(keywords[j]) >= 0) return i;
      }
    }
    return SHOPPING_CATEGORIES.length; // catch-all, always last
  }

  function fmtAmount(item) {
    if (item.amount == null) return '';
    const n = Number.isInteger(item.amount) ? item.amount : item.amount.toFixed(1).replace('.', ',');
    return n + (item.unit ? ' ' + item.unit : '');
  }

  // Text att dela: bara det du ännu ska handla (avbockade varor tas inte med).
  function shoppingListText() {
    const items = buildShoppingList().filter(function(it) { return !shopChecked[itemKey(it)]; });
    if (items.length === 0) return '';
    return 'Inköpslista\n' + items.map(function(it) {
      const amt = fmtAmount(it);
      return '• ' + (amt ? amt + ' ' : '') + it.name;
    }).join('\n');
  }

  // Text att dela för veckans måltider: bara dagar och rätter (ingen mängd, inga personer).
  // Andra portionen av en 2x-rätt märks "(rester)".
  function menuText() {
    const rester = {};
    const seen = {};
    Object.keys(planAssignments).forEach(function(k) {
      const a = planAssignments[k];
      if (a && a.name && !seen[a.name]) {
        seen[a.name] = true;
        slotsOf(a.name).slice(1).forEach(function(rk) { rester[rk] = true; });
      }
    });
    function label(key) {
      const a = planAssignments[key];
      return (a && a.name) ? a.name + (rester[key] ? ' (rester)' : '') : null;
    }
    const lines = [];
    DAY_OPTIONS.forEach(function(day) {
      const names = [DINNER, DINNER2].map(function(m) { return label(slotKey(day, m)); }).filter(Boolean);
      if (names.length) lines.push(day + ': ' + names.join(', '));
    });
    const extra = extraKeys().map(function(k) { return label(k); }).filter(Boolean);
    if (extra.length) lines.push('Extra: ' + extra.join(', '));
    return lines.length ? 'Veckans måltider\n' + lines.join('\n') : '';
  }

  function flashShareMsg(msg, elId) {
    const id = elId || 'shareMsg';
    const el = document.getElementById(id);
    if (el) el.textContent = msg;
    setTimeout(function() {

      if (e2 && e2.textContent === msg) e2.textContent = '';
    }, 4000);
  }

  const SHARE_KINDS = {
    shop: {
      text: function() { return shoppingListText(); }, title: 'Inköpslista', msgId: 'shareMsg',
      empty: 'Inget att dela — allt är avbockat eller listan är tom.', done: 'Inköpslistan är kopierad — klistra in i valfri app.'
    },

    }

  // Systemets delningsruta (på mobil finns WhatsApp, Messenger, SMS m.fl. där).
  async function shareKind(kind) {
    const k = SHARE_KINDS[kind];
    const text = k.text();
    if (!text) { flashShareMsg(k.empty, k.msgId); return; }
    try {
      await navigator.share({ title: k.title, text: text });
    } catch (e) {
      if (e && e.name === 'AbortError') return; // du ångrade dig
      await copyKind(kind);
    }
  }

  // Öppnar WhatsApp med texten ifylld (app på mobil, WhatsApp Web på dator).
  function whatsappKind(kind) {
    const k = SHARE_KINDS[kind];
    const text = k.text();
    if (!text) { flashShareMsg(k.empty, k.msgId); return; }
    window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank', 'noopener');
  }

  async function copyKind(kind) {
    const k = SHARE_KINDS[kind];
    const text = k.text();
    if (!text) { flashShareMsg(k.empty.replace('dela', 'kopiera'), k.msgId); return; }
    let ok = false;
    try {
      if (typeof navigator !== 'undefined' && navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(text);
        ok = true;
      }
    } catch (e) { /* prova reservvägen */ }
    if (!ok) {
      try {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        ok = document.execCommand('copy');
        document.body.removeChild(ta);
      } catch (e) { ok = false; }
    }
    if (ok) {
      shareFallbackText = '';
      shareFallbackKind = '';
      flashShareMsg(k.done, k.msgId);
    } else {
      shareFallbackText = text;
      shareFallbackKind = kind;
      render();
    }
  }

  function parseDishLine(line) {
    let fav = false;
    line = line.trim();
    if (line.charAt(0) === '★') { fav = true; line = line.slice(1).trim(); }
    const tagMarker = ' @tags: ';
    const recMarker = ' @recipe: ';
    let tags = [];
    let recipe = '';
    // Peel off whichever marker sits furthest right first, so the order they were
    // written in (recipe-then-tags, as we export, or the reverse) doesn't matter.
    while (true) {
      const ti = line.lastIndexOf(tagMarker);
      const ri = line.lastIndexOf(recMarker);
      if (ti === -1 && ri === -1) break;
      if (ti > ri) {
        tags = parseTagsInput(line.slice(ti + tagMarker.length));
        line = line.slice(0, ti).trim();
      } else {
        recipe = line.slice(ri + recMarker.length).trim().replace(/\\n/g, '\n');
        line = line.slice(0, ri).trim();
      }
    }
    const idx = line.indexOf(':');
    if (idx === -1) return { name: line.trim(), ingredients: [], favorite: fav, recipe: recipe, tags: tags };
    const name = line.slice(0, idx).trim();
    const ingredientsPart = line.slice(idx + 1);
    const ingredients = ingredientsPart.split(',').map(function(s) { return s.trim(); }).filter(Boolean).map(parseIngredient);
    return { name: name, ingredients: ingredients, favorite: fav, recipe: recipe, tags: tags };
  }

  // Bulkimport av recept: block i formen "=== Rättnamn ===" följt av receptet,
  // ett block per rätt. Namnet måste stämma (skiftläge spelar ingen roll) med en
  // rätt som redan finns i listan.
  function parseRecipeBulkText(text) {
    const parts = text.split(/^===\s*(.+?)\s*===\s*$/m);
    const result = [];
    for (let i = 1; i < parts.length; i += 2) {
      const name = parts[i].trim();
      const body = (parts[i + 1] || '').trim();
      if (name) result.push({ name: name, recipe: body });
    }
    return result;
  }

  async function importRecipesBulk() {
    const el = document.getElementById('bulkRecipeInput');
    if (!el) return;
    bulkRecipeText = el.value;
    const items = parseRecipeBulkText(bulkRecipeText);
    if (items.length === 0) {
      recipeImportMsg = 'Hittade inga rätter i texten. Kontrollera formatet: === Rättnamn === på egen rad, följt av receptet.';
      render();
      return;
    }
    let matched = 0;
    const notFound = [];
    items.forEach(function(item) {
      const dish = dishes.find(function(d) { return d.name.toLowerCase() === item.name.toLowerCase(); });
      if (dish) { dish.recipe = item.recipe; matched++; }
      else notFound.push(item.name);
    });
    try { await storage.set('dishes', JSON.stringify(dishes)); } catch (e) { /* best effort */ }
    recipeImportMsg = matched + ' av ' + items.length + ' recept sparade.' +
      (notFound.length ? ' Hittade inte (kolla stavningen): ' + notFound.join(', ') + '.' : '');
    render();
  }

  // Bulkimport av taggar: en rad per rätt, "Rättnamn: tagg1, tagg2". Ersätter bara
  // taggarna för matchande rätter, rör ingenting annat (ingredienser, recept, favorit).
  function parseTagsBulkText(text) {
    const result = [];
    text.split('\n').forEach(function(line) {
      line = line.trim();
      if (!line) return;
      const idx = line.indexOf(':');
      if (idx === -1) return;
      const name = line.slice(0, idx).trim();
      if (!name) return;
      result.push({ name: name, tags: parseTagsInput(line.slice(idx + 1)) });
    });
    return result;
  }

  async function importTagsBulk() {
    const el = document.getElementById('bulkTagsInput');
    if (!el) return;
    bulkTagsText = el.value;
    const items = parseTagsBulkText(bulkTagsText);
    if (items.length === 0) {
      tagImportMsg = 'Hittade inga rätter i texten. Kontrollera formatet: Rättnamn: tagg1, tagg2 — en rätt per rad.';
      render();
      return;
    }
    let matched = 0;
    const notFound = [];
    items.forEach(function(item) {
      const dish = dishes.find(function(d) { return d.name.toLowerCase() === item.name.toLowerCase(); });
      if (dish) { dish.tags = item.tags; matched++; }
      else notFound.push(item.name);
    });
    try { await storage.set('dishes', JSON.stringify(dishes)); } catch (e) { /* best effort */ }
    tagImportMsg = matched + ' av ' + items.length + ' rätter taggade.' +
      (notFound.length ? ' Hittade inte (kolla stavningen): ' + notFound.join(', ') + '.' : '');
    render();
  }

  function handleAdd() {
    const nameEl = document.getElementById('addName');
    const ingEl = document.getElementById('addIngredients');
    const recEl = document.getElementById('addRecipe');
    const tagEl = document.getElementById('addTags');
    const newName = nameEl.value.trim();

    let fav = false;
    if (editingDishName) {
      const oldDish = findDish(editingDishName);
      fav = !!(oldDish && oldDish.favorite);
      if (newName && editingDishName.toLowerCase() !== newName.toLowerCase()) {
        // renamed — drop the old entry so we don't end up with two dishes
        dishes = dishes.filter(function(d) { return d.name !== editingDishName; });
        renameReferences(editingDishName, newName);
      }
    }
    editingDishName = null;
    addDish(newName, ingEl.value, fav, recEl ? recEl.value : '', tagEl ? tagEl.value : '');
    // render() inside addDish/persistDishesQuiet rebuilds the DOM, so fields clear naturally
  }

  function showFatalError(err) {
    root.innerHTML = '<div style="max-width:520px;margin:60px auto;padding:24px;background:#3a2018;border:1px solid #a6432c;border-radius:4px;color:#f3efe3;font-family:sans-serif;line-height:1.6;">' +
      '<strong>Något gick fel när sidan skulle starta:</strong><br><br>' +
      escapeHtml(String(err && err.message ? err.message : err)) +
      '<br><br><span style="opacity:0.7;font-size:0.85em;">Öppna webbläsarens konsol (F12) för mer detaljer, eller ladda om sidan.</span></div>';
  }

  window.addEventListener('error', function(e) { showFatalError(e.error || e.message); });
  window.addEventListener('unhandledrejection', function(e) { showFatalError(e.reason); });

  try {
    loadState();
  } catch (e) {
    showFatalError(e);
  }
</script>

<script>
  // Registers the service worker so Android Chrome can offer a real "Installera app"
  // prompt and the page keeps working offline. Only runs when the page is actually
  // hosted (http/https) — on a local file:// copy this is silently skipped.
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.protocol === 'http:')) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./sw.js').catch(function () { /* best effort, app still works */ });
    });
  }
</script>
